<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Shader</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none;
           -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.pan { cursor: move; }
  canvas.over-box { cursor: pointer; }
  .modes, .shapes {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 2px; padding: 3px;
    background: rgba(20, 24, 32, 0.85); border: 1px solid #2c3340; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .modes button, .shapes button {
    font: 13px/1 system-ui, sans-serif; color: #9aa4b5;
    background: transparent; border: 0; border-radius: 7px;
    padding: 9px 14px; cursor: pointer;
  }
  .modes button:hover, .shapes button:hover { color: #dce3ee; }
  .shapes { bottom: 66px; }
  .modes button[aria-pressed="true"], .shapes button[aria-pressed="true"] { background: #3a4558; color: #fff; }
  .modes .sep { width: 1px; margin: 4px 3px; background: #2c3340; }
  .modes button:disabled { opacity: 0.4; cursor: default; }
  .palette {
    position: fixed; display: grid; grid-template-columns: repeat(4, 40px); gap: 8px; padding: 10px;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 12px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .palette[hidden] { display: none; }
  .palette button {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.15);
  }
  .palette button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="palette" id="palette" role="group" aria-label="色" hidden></div>
<div class="shapes" role="group" aria-label="追加する形">
  <button type="button" data-shape="0" aria-pressed="true">立方体</button>
  <button type="button" data-shape="1" aria-pressed="false">トーラス</button>
  <button type="button" data-shape="2" aria-pressed="false">三角錐</button>
</div>
<div class="modes" role="group" aria-label="操作モード">
  <button type="button" data-mode="orbit" aria-pressed="true">回転</button>
  <button type="button" data-mode="pan" aria-pressed="false">移動</button>
  <span class="sep"></span>
  <button type="button" id="add">追加</button>
  <button type="button" id="reset">リセット</button>
</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');
if (!gl) document.body.textContent = 'WebGL2 に対応していません';

const vs = `#version 300 es
in vec2 pos;
void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

const fs = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform vec3 uCam;
uniform vec3 uTarget;
#define MAX_BOXES 32
uniform vec3 uBoxes[MAX_BOXES];
uniform int uCount;
uniform vec3 uColors[MAX_BOXES];
uniform float uRots[MAX_BOXES];
uniform int uShapes[MAX_BOXES]; // 0: 立方体, 1: トーラス, 2: 三角錐
uniform int uSel; // 掴んでいる立方体の番号 (なければ -1)
out vec4 outColor;

// 線幅(ピクセル単位)を一定に保つアンチエイリアス付きグリッド
float grid(vec2 p, float lineWidth) {
  vec2 d = fwidth(p);
  vec2 g = abs(fract(p - 0.5) - 0.5) / d;
  float line = min(g.x, g.y);
  return 1.0 - clamp(line - lineWidth + 1.0, 0.0, 1.0);
}

// 形はどれも底面中心が原点のローカル座標で定義し、uBoxes[i] (底面中心) と uRots[i] で置く。
// 足場は 1x1。高さは 立方体 1、トーラス 0.3、三角錐 0.8
const vec3 LIGHT = normalize(vec3(0.6, 1.0, 0.35));
const float TORUS_R = 0.35, TORUS_r = 0.15; // 中心円の半径と管の半径 (寝かせて置く)
const float PYR_H = 0.8;                    // 三角錐の高さ (底面は外接円の半径 0.5 の正三角形)

// 縦軸 (y) まわりの回転
vec3 rotY(vec3 v, float a) {
  float c = cos(a), s = sin(a);
  return vec3(v.x * c + v.z * s, v.y, -v.x * s + v.z * c);
}

// レイと箱 [mn, mx] の交差区間 [tn, tf]。当たらなければ false。n は入る面の法線
bool slab(vec3 ro, vec3 rd, vec3 mn, vec3 mx, out float tn, out float tf, out vec3 n) {
  vec3 inv = 1.0 / rd;
  vec3 t0 = (mn - ro) * inv, t1 = (mx - ro) * inv;
  vec3 tmin = min(t0, t1), tmax = max(t0, t1);
  tn = max(max(tmin.x, tmin.y), tmin.z);
  tf = min(min(tmax.x, tmax.y), tmax.z);
  n = -sign(rd) * step(tmin.yzx, tmin.xyz) * step(tmin.zxy, tmin.xyz);
  return tn <= tf && tf >= 0.0;
}

// トーラス: 囲む箱の中だけを距離関数でレイマーチする
float torusHit(vec3 ro, vec3 rd, out vec3 n) {
  float tn, tf;
  vec3 nb;
  if (!slab(ro, rd, vec3(-0.5, 0.0, -0.5), vec3(0.5, 2.0 * TORUS_r, 0.5), tn, tf, nb)) return -1.0;
  float t = max(tn, 0.0);
  for (int k = 0; k < 64; k++) {
    vec3 p = ro + rd * t - vec3(0.0, TORUS_r, 0.0);
    float d = length(vec2(length(p.xz) - TORUS_R, p.y)) - TORUS_r;
    if (d < 0.0005) {
      n = normalize(p - TORUS_R * normalize(vec3(p.x, 0.0, p.z)));
      return t;
    }
    t += d;
    if (t > tf) break;
  }
  return -1.0;
}

// 三角錐: 底面と3つの側面の半空間の共通部分として判定する
float pyramidHit(vec3 ro, vec3 rd, out vec3 n) {
  float tn = -1e9, tf = 1e9;
  for (int k = 0; k < 4; k++) {
    vec3 N; float D;
    if (k == 0) { N = vec3(0.0, -1.0, 0.0); D = 0.0; }
    else {
      // 側面の外向き法線。底辺の中点の向き φ = 30°, 150°, 270°、底辺までの距離 0.25
      float phi = radians(30.0 + 120.0 * float(k - 1));
      N = normalize(vec3(PYR_H * cos(phi), 0.25, PYR_H * sin(phi)));
      D = dot(N, vec3(0.25 * cos(phi), 0.0, 0.25 * sin(phi)));
    }
    float den = dot(N, rd), dist = D - dot(N, ro);
    if (abs(den) < 1e-7) { if (dist < 0.0) return -1.0; continue; }
    float t = dist / den;
    if (den < 0.0) { if (t > tn) { tn = t; n = N; } }
    else tf = min(tf, t);
  }
  return (tn <= tf && tf >= 0.0) ? tn : -1.0;
}

// o は底面中心、r は縦軸まわりの回転角。レイを形のローカル座標に直して判定する
float shapeHit(vec3 ro, vec3 rd, vec3 o, float r, int shape, out vec3 n) {
  ro = rotY(ro - o, -r);
  rd = rotY(rd, -r);
  vec3 ln = vec3(0.0, 1.0, 0.0);
  float t;
  if (shape == 1) t = torusHit(ro, rd, ln);
  else if (shape == 2) t = pyramidHit(ro, rd, ln);
  else {
    float tf;
    t = slab(ro, rd, vec3(-0.5, 0.0, -0.5), vec3(0.5, 1.0, 0.5), t, tf, ln) ? t : -1.0;
  }
  n = rotY(ln, r);
  return t;
}

// すべての立方体のうち一番手前の交差 (当たらなければ -1)。法線と番号も返す
float sceneHit(vec3 ro, vec3 rd, out vec3 n, out int id) {
  float best = -1.0;
  for (int i = 0; i < MAX_BOXES; i++) {
    if (i >= uCount) break;
    vec3 ni;
    float t = shapeHit(ro, rd, uBoxes[i], uRots[i], uShapes[i], ni);
    if (t > 0.0 && (best < 0.0 || t < best)) { best = t; n = ni; id = i; }
  }
  return best;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  // 斜め上から見下ろすカメラ
  vec3 ro = uCam;
  vec3 target = uTarget;
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw * 1.6 + uv.x * rt + uv.y * up);

  vec3 bg = mix(vec3(0.04, 0.05, 0.07), vec3(0.10, 0.12, 0.17), uv.y + 0.5);
  vec3 col = bg;

  // 地面 y = 0 との交差
  if (rd.y < 0.0) {
    float t = -ro.y / rd.y;
    vec2 p = (ro + rd * t).xz;

    float minor = grid(p, 1.0);
    float major = grid(p / 5.0, 1.5);

    vec3 c = vec3(0.07, 0.08, 0.10);
    c = mix(c, vec3(0.30, 0.34, 0.42), minor);
    c = mix(c, vec3(0.55, 0.62, 0.75), major);

    // 原点の軸 (X: 赤, Z: 青)
    vec2 ad = abs(p) / fwidth(p);
    c = mix(c, vec3(0.90, 0.30, 0.30), 1.0 - clamp(ad.y - 1.0, 0.0, 1.0));
    c = mix(c, vec3(0.30, 0.50, 0.95), 1.0 - clamp(ad.x - 1.0, 0.0, 1.0));

    // 立方体の影
    vec3 sn;
    int sid;
    if (sceneHit(vec3(p.x, 0.001, p.y), LIGHT, sn, sid) > 0.0) c *= 0.45;

    // 遠くほど背景に溶かす
    float fade = exp(-t * 0.035);
    col = mix(bg, c, fade);
  }

  // 立方体 (地面より手前にあれば上書き)
  vec3 n;
  int id;
  float tb = sceneHit(ro, rd, n, id);
  if (tb > 0.0) {
    float diff = max(dot(n, LIGHT), 0.0);
    // ほかの立方体の影
    vec3 sn;
    int sid;
    if (diff > 0.0 && sceneHit(ro + rd * tb + n * 0.001, LIGHT, sn, sid) > 0.0) diff = 0.0;
    vec3 base = uColors[id];
    if (id == uSel) base = mix(base, vec3(1.0), 0.35); // 掴んでいる立方体は明るくする
    col = base * (0.18 + 0.82 * diff);
  }

  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, 'uRes');
const uCam = gl.getUniformLocation(prog, 'uCam');
const uTarget = gl.getUniformLocation(prog, 'uTarget');
const uBoxes = gl.getUniformLocation(prog, 'uBoxes');
const uCount = gl.getUniformLocation(prog, 'uCount');
const uColors = gl.getUniformLocation(prog, 'uColors');
const uRots = gl.getUniformLocation(prog, 'uRots');
const uSel = gl.getUniformLocation(prog, 'uSel');
const uShapes = gl.getUniformLocation(prog, 'uShapes');

// 立方体の色 (リニア値。シェーダーでガンマ補正される)
const PALETTE = [
  [0.85, 0.62, 0.32], // 黄土
  [0.85, 0.22, 0.18], // 赤
  [0.12, 0.58, 0.52], // 青緑
  [0.18, 0.32, 0.85], // 青
  [0.55, 0.28, 0.80], // 紫
  [0.35, 0.70, 0.22], // 緑
  [0.90, 0.32, 0.55], // ピンク
  [0.62, 0.66, 0.72], // 灰
];
const PALETTE_NAMES = ['黄土', '赤', '青緑', '青', '紫', '緑', 'ピンク', '灰'];

// --- 色選び (スマホで立方体をタップしたときに出すパレット) ---
const paletteEl = document.getElementById('palette');
let pickerBox = null; // パレットで色を変えている立方体
const swatches = PALETTE.map((c, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', PALETTE_NAMES[i]);
  b.style.background = `rgb(${c.map(v => Math.round(Math.pow(v, 1 / 2.2) * 255)).join(',')})`; // 画面と同じガンマ補正
  b.addEventListener('click', () => {
    if (pickerBox) pickerBox.c = i;
    closePicker();
  });
  paletteEl.append(b);
  return b;
});
function openPicker(box, x, y) {
  pickerBox = box;
  swatches.forEach((b, i) => b.setAttribute('aria-pressed', i === box.c));
  paletteEl.hidden = false;
  // タップした位置の上に出す。画面からはみ出す場合は下に出し、左右は端から 16px 以上離す
  const w = paletteEl.offsetWidth, h = paletteEl.offsetHeight;
  paletteEl.style.left = `${Math.min(Math.max(x - w / 2, 16), innerWidth - w - 16)}px`;
  paletteEl.style.top = `${y - h - 24 >= 16 ? y - h - 24 : Math.min(y + 24, innerHeight - h - 16)}px`;
  requestDraw();
}
function closePicker() {
  if (paletteEl.hidden) return;
  paletteEl.hidden = true;
  pickerBox = null;
  requestDraw();
}
addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
// まだ使われていない色を優先し、全色使用中なら一番使われていない色を選ぶ
function nextColor() {
  const used = PALETTE.map((_, i) => boxes.filter(b => b.c === i).length);
  return used.indexOf(Math.min(...used));
}
const MAX_BOXES = 32;

// オービットカメラ (注視点を中心に回転 / 地面に沿って移動)
const CAM_DEFAULT = { yaw: Math.PI / 4, pitch: 0.6, dist: 9.8, tx: 0, tz: 0 };
const cam = { ...CAM_DEFAULT };
document.getElementById('reset').addEventListener('click', () => {
  closePicker();
  Object.assign(cam, CAM_DEFAULT);
  boxes.length = 0;
  boxes.push(makeBox(0, 0, 0));
  updateAddButton();
  requestDraw();
});

let mode = 'orbit';
const modeButtons = document.querySelectorAll('.modes button[data-mode]');
function setMode(m) {
  mode = m;
  modeButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  canvas.classList.toggle('pan', m === 'pan');
}
modeButtons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// 立方体の位置 (底面中心の xz)
// y は積み重ねで決まる高さ、py は画面に表示している高さ (落下中は y より上)、vy は落下速度
// r は縦軸まわりの回転角 (ラジアン)
// s は形 (0: 立方体, 1: トーラス, 2: 三角錐)
const SHAPE_HEIGHT = [1, 0.3, 0.8];
const TORUS_R = 0.35, TORUS_r = 0.15, PYR_H = 0.8; // シェーダーと同じ値
const makeBox = (x, z, c, s = 0) => ({ x, y: 0, z, c, s, r: 0, py: 0, vy: 0 });
const topOf = b => b.y + SHAPE_HEIGHT[b.s]; // 上に載せられる高さ

// 追加する形の選択
let currentShape = 0;
const shapeButtons = document.querySelectorAll('.shapes button');
shapeButtons.forEach(b => b.addEventListener('click', () => {
  currentShape = +b.dataset.shape;
  shapeButtons.forEach(o => o.setAttribute('aria-pressed', o === b));
}));
const boxes = [makeBox(0, 0, 0)];

// --- 積み重ね ---
// 上から見て足場が重なっているか
// (回転した正方形どうしを分離軸判定で調べる)
function overlaps(a, b) {
  const h = 0.4995; // 辺がちょうど接しているだけなら重なりとしない
  const axes = r => [[Math.cos(r), -Math.sin(r)], [Math.sin(r), Math.cos(r)]];
  const aa = axes(a.r), ba = axes(b.r);
  const d = [b.x - a.x, b.z - a.z];
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1];
  for (const u of [...aa, ...ba]) {
    const ra = h * (Math.abs(dot(u, aa[0])) + Math.abs(dot(u, aa[1])));
    const rb = h * (Math.abs(dot(u, ba[0])) + Math.abs(dot(u, ba[1])));
    if (Math.abs(dot(d, u)) >= ra + rb) return false;
  }
  return true;
}
// b の上に (直接または間接的に) 載っている立方体と b 自身
function stackFrom(b) {
  const group = [b];
  for (let i = 0; i < group.length; i++) {
    const s = group[i];
    for (const o of boxes) {
      if (!group.includes(o) && overlaps(o, s) && Math.abs(o.y - topOf(s)) < 1e-3) group.push(o);
    }
  }
  return group;
}
// 重力: 下にあるものから順に、足場の一番高い所まで落とす (exclude は動かさない)
function settle(exclude = []) {
  const placed = [];
  for (const b of boxes.filter(b => !exclude.includes(b)).sort((a, b) => a.y - b.y)) {
    b.y = Math.max(0, ...placed.filter(o => overlaps(o, b)).map(topOf));
    placed.push(b);
  }
  startFall();
}

// 落下アニメーション: 表示上の高さ py を、重力で y まで落とす (着地で少し跳ねる)。
// 上がるときは y より少し高くまで跳び上がってから、同じ重力で着地する
const GRAVITY = 40;
const HOP = 0.25; // 跳び乗るときに y より上へ跳ぶ高さ
let falling = false, lastTime = 0;
function startFall() {
  for (const b of boxes) {
    if (b.py >= b.y) continue;
    const v0 = Math.sqrt(2 * GRAVITY * (b.y - b.py + HOP));
    if (b.vy > -v0) b.vy = -v0; // vy は下向きが正
  }
  if (falling || !boxes.some(b => b.py !== b.y || b.vy !== 0)) return;
  falling = true;
  lastTime = 0;
  requestAnimationFrame(fallStep);
}
function fallStep(now) {
  // 最初のフレームは基準時刻だけ取る (rAF の時刻は performance.now() より前のことがある)
  const dt = lastTime ? Math.min(Math.max(now - lastTime, 0) / 1000, 1 / 30) : 0;
  lastTime = now;
  let moving = false;
  for (const b of boxes) {
    if (b.py === b.y && b.vy === 0) continue;
    b.vy += GRAVITY * dt;
    b.py -= b.vy * dt;
    if (b.vy > 0 && b.py <= b.y) {
      b.py = b.y;
      b.vy = b.vy > 3 ? -b.vy * 0.25 : 0; // 速ければ小さく跳ね返る
    }
    if (b.py !== b.y || b.vy !== 0) moving = true;
  }
  render();
  if (moving) requestAnimationFrame(fallStep);
  else falling = false;
}

// 画面中央 (注視点) に近い、ほかの立方体と重ならないマス目に追加する
const addButton = document.getElementById('add');
function updateAddButton() { addButton.disabled = boxes.length >= MAX_BOXES; }
addButton.addEventListener('click', () => {
  if (boxes.length >= MAX_BOXES) return;
  const cx = Math.round(cam.tx), cz = Math.round(cam.tz);
  const free = (x, z) => boxes.every(b => Math.max(Math.abs(b.x - x), Math.abs(b.z - z)) >= 1.5);
  for (let r = 0; r < 20; r++) {
    for (let i = -r; i <= r; i++) {
      for (const [x, z] of [[cx + i, cz - r], [cx + i, cz + r], [cx - r, cz + i], [cx + r, cz + i]]) {
        if (free(x, z)) {
          boxes.push(makeBox(x, z, nextColor(), currentShape));
          updateAddButton();
          requestDraw();
          return;
        }
      }
    }
  }
});

// --- シェーダーと同じカメラで、画面上の点からレイを作る ---
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; };

function camPos() {
  const cp = Math.cos(cam.pitch);
  return [
    cam.tx + cam.dist * cp * Math.cos(cam.yaw),
    cam.dist * Math.sin(cam.pitch),
    cam.tz + cam.dist * cp * Math.sin(cam.yaw)];
}
function screenRay(cx, cy) {
  const ro = camPos();
  const fw = norm(sub([cam.tx, 0, cam.tz], ro));
  const rt = norm(cross3(fw, [0, 1, 0]));
  const up = cross3(rt, fw);
  const h = innerHeight;
  const ux = (cx - innerWidth / 2) / h, uy = (h / 2 - cy) / h;
  const rd = norm([0, 1, 2].map(i => fw[i] * 1.6 + ux * rt[i] + uy * up[i]));
  return { ro, rd };
}
// レイと立方体の交差距離 (当たらなければ -1)
const rotY = (v, a) => {
  const c = Math.cos(a), s = Math.sin(a);
  return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c];
};
// レイと箱 [mn, mx] の交差区間 [tn, tf] (当たらなければ null)
function slab(ro, rd, mn, mx) {
  let tn = -Infinity, tf = Infinity;
  for (let i = 0; i < 3; i++) {
    const a = (mn[i] - ro[i]) / rd[i], b = (mx[i] - ro[i]) / rd[i];
    tn = Math.max(tn, Math.min(a, b));
    tf = Math.min(tf, Math.max(a, b));
  }
  return tn <= tf && tf >= 0 ? [tn, tf] : null;
}
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
// 形ごとの交差判定 (シェーダーと同じ。ro, rd はローカル座標)
function localHit(s, ro, rd) {
  if (s === 1) {
    const iv = slab(ro, rd, [-0.5, 0, -0.5], [0.5, 2 * TORUS_r, 0.5]);
    if (!iv) return -1;
    let t = Math.max(iv[0], 0);
    for (let k = 0; k < 64 && t <= iv[1]; k++) {
      const p = [ro[0] + rd[0] * t, ro[1] + rd[1] * t - TORUS_r, ro[2] + rd[2] * t];
      const d = Math.hypot(Math.hypot(p[0], p[2]) - TORUS_R, p[1]) - TORUS_r;
      if (d < 0.0005) return t;
      t += d;
    }
    return -1;
  }
  if (s === 2) {
    let tn = -Infinity, tf = Infinity;
    for (let k = 0; k < 4; k++) {
      let N, D;
      if (k === 0) { N = [0, -1, 0]; D = 0; }
      else {
        const phi = (30 + 120 * (k - 1)) * Math.PI / 180;
        N = norm([PYR_H * Math.cos(phi), 0.25, PYR_H * Math.sin(phi)]);
        D = dot3(N, [0.25 * Math.cos(phi), 0, 0.25 * Math.sin(phi)]);
      }
      const den = dot3(N, rd), dist = D - dot3(N, ro);
      if (Math.abs(den) < 1e-7) { if (dist < 0) return -1; continue; }
      const t = dist / den;
      if (den < 0) tn = Math.max(tn, t); else tf = Math.min(tf, t);
    }
    return tn <= tf && tf >= 0 ? tn : -1;
  }
  const iv = slab(ro, rd, [-0.5, 0, -0.5], [0.5, 1, 0.5]);
  return iv ? iv[0] : -1;
}
function rayBox(ray, box) {
  // シェーダーと同じく、レイを形のローカル座標に直して判定する
  const ro = rotY(sub(ray.ro, [box.x, box.py, box.z]), -box.r);
  const rd = rotY(ray.rd, -box.r);
  const t = localHit(box.s, ro, rd);
  return t > 0 ? t : -1;
}
// 一番手前で当たる立方体 { box, t } (なければ null)
function pickBox(ray) {
  let best = null;
  for (const box of boxes) {
    const t = rayBox(ray, box);
    if (t > 0 && (!best || t < best.t)) best = { box, t };
  }
  return best;
}
// レイと水平面 y = h の交点 (xz)。面と平行なら null
function rayPlane({ ro, rd }, h) {
  if (Math.abs(rd[1]) < 1e-6) return null;
  const t = (h - ro[1]) / rd[1];
  return t > 0 ? [ro[0] + rd[0] * t, ro[2] + rd[2] * t] : null;
}

let drag = null;
const LONG_PRESS_MS = 400; // スマホで立方体を掴む・置くまでの長押し時間
// 長押しが成立したことを振動で知らせる (ブラウザは、まだ一度も操作されていないページからの振動を拒否する)
const buzz = () => { if (navigator.userActivation?.hasBeenActive ?? true) navigator.vibrate?.(15); };
// 指定した地面の位置に立方体を置く。ほかの立方体と重なればその上に積む。少し上から落として置く
function placeBox(x, z) {
  if (boxes.length >= MAX_BOXES) return false;
  const b = makeBox(x, z, nextColor(), currentShape);
  boxes.push(b);
  settle();
  b.py = b.y + 1.5;
  b.vy = 0;
  startFall();
  updateAddButton();
  return true;
}
const pointers = new Map(); // 画面に触れている指 (マウス) の位置

// b とその上に載っている立方体を、b を軸にまとめて回すための情報
const rotationGroup = b =>
  ({ box: b, group: stackFrom(b).map(o => ({ o, dx: o.x - b.x, dz: o.z - b.z, r: o.r })) });
// 回し始めからの角度 a (ラジアン) だけ回す
function rotateGroup({ box, group }, a) {
  const c = Math.cos(a), sn = Math.sin(a);
  for (const g of group) {
    g.o.x = box.x + g.dx * c + g.dz * sn;
    g.o.z = box.z - g.dx * sn + g.dz * c;
    g.o.r = g.r + a;
  }
  requestDraw();
}
const pointerAngle = ([a, b]) => {
  const p = pointers.get(a), q = pointers.get(b);
  return Math.atan2(q.y - p.y, q.x - p.x);
};
const pointerDistance = ([a, b]) => {
  const p = pointers.get(a), q = pointers.get(b);
  return Math.max(Math.hypot(q.x - p.x, q.y - p.y), 1);
};

canvas.addEventListener('pointerdown', e => {
  closePicker(); // パレットの外を触ったら閉じる
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch {} // 捕捉できなくても操作は続ける
  if (drag) {
    // 立方体を押さえたままもう1本の指を置いたら、2本指をひねって回す (スマホ用)
    const held = drag.box?.box ?? drag.rot?.box ?? drag.pending?.box;
    if (drag.twist || drag.pinch || pointers.size !== 2) return;
    const ids = [drag.id, e.pointerId];
    if (drag.pending) { clearTimeout(drag.pending.timer); drag.pending = null; }
    if (held) {
      drag.twist = { ...rotationGroup(held), ids, last: pointerAngle(ids), total: 0 };
      drag.box = drag.rot = null;
    } else {
      // 立方体以外に置いた2本の指は、ピンチでズーム
      drag.pinch = { ids, last: pointerDistance(ids) };
    }
    return;
  }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  // 立方体を掴んだら、掴んだ点の高さの水平面に沿って動かす
  const ray = screenRay(e.clientX, e.clientY);
  const picked = pickBox(ray);
  if (picked) {
    const { box, t } = picked;
    const hy = ray.ro[1] + ray.rd[1] * t;
    const hit = [ray.ro[0] + ray.rd[0] * t, ray.ro[2] + ray.rd[2] * t];
    // 上に載っている立方体も一緒に運ぶ。運んでいる間は持ち上げた高さを保ち、離したときに落とす
    const grab = () => {
      const group = stackFrom(box).map(o => ({ o, dx: o.x - box.x, dy: o.y - box.y, dz: o.z - box.z }));
      drag.box = { box, group, held: box.py, h: hy, ox: box.x - hit[0], oz: box.z - hit[1] };
      requestDraw();
    };
    if (e.shiftKey) {
      // Shift+ドラッグ: 縦軸まわりに回す
      drag.rot = rotationGroup(box);
    } else if (e.pointerType === 'touch') {
      // スマホは長押しで掴む。その前に指を動かしたら、ふつうにカメラを動かす
      const d = drag;
      d.pending = {
        box,
        timer: setTimeout(() => {
          d.pending = null;
          d.grabbed = true;
          grab();
          buzz();
        }, LONG_PRESS_MS),
      };
    } else {
      grab();
    }
  } else if (e.pointerType === 'touch' && !e.shiftKey) {
    // スマホで何もない地面を長押ししたら、そこに立方体を置く
    const ground = rayPlane(ray, 0);
    if (ground) {
      const d = drag;
      d.pending = {
        timer: setTimeout(() => {
          d.pending = null;
          d.grabbed = true; // 離したときにタップ扱いにしない
          d.placed = true;  // 置いたあとは、その指を離すまで何もしない
          if (placeBox(ground[0], ground[1])) buzz();
        }, LONG_PRESS_MS),
      };
    }
  }
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) {
    canvas.classList.toggle('over-box', !!pickBox(screenRay(e.clientX, e.clientY)));
    return;
  }
  if (drag.twist) {
    // 画面上で指を時計回りにひねると、上から見て時計回りに回る
    const t = drag.twist;
    const ang = pointerAngle(t.ids);
    let d = ang - t.last;
    if (d > Math.PI) d -= 2 * Math.PI;
    if (d < -Math.PI) d += 2 * Math.PI;
    t.last = ang;
    t.total += d;
    rotateGroup(t, -t.total);
    return;
  }
  if (drag.pinch) {
    // 指を広げると近づき、狭めると離れる
    const d = pointerDistance(drag.pinch.ids);
    zoomBy(drag.pinch.last / d);
    drag.pinch.last = d;
    return;
  }
  if (e.pointerId !== drag.id || drag.placed) return; // 2本目の指の動きは、ひねり・ピンチ以外では使わない
  if (drag.pending) {
    // 長押しになる前に指が動いたら、立方体は掴まずにカメラの操作にする
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) <= 10) return;
    clearTimeout(drag.pending.timer);
    drag.pending = null;
  }
  if (drag.rot) {
    // 右へドラッグすると手前の面が右へ動く向きに回す
    rotateGroup(drag.rot, (e.clientX - drag.sx) * 0.01);
    return;
  }
  if (drag.box) {
    const hit = rayPlane(screenRay(e.clientX, e.clientY), drag.box.h);
    if (hit) {
      const { box, group } = drag.box;
      const members = group.map(g => g.o);
      box.x = hit[0] + drag.box.ox;
      box.z = hit[1] + drag.box.oz;
      for (const g of group) { g.o.x = box.x + g.dx; g.o.z = box.z + g.dz; }
      // 運んでいない立方体を落とし、運んでいる山はその上に載せる
      settle(members);
      const others = boxes.filter(o => !members.includes(o));
      const base = Math.max(drag.box.held, ...group.map(g =>
        Math.max(0, ...others.filter(o => overlaps(o, g.o)).map(topOf)) - g.dy));
      drag.box.held = base;
      for (const g of group) {
        if (g.o.py > base + g.dy) { g.o.py = base + g.dy; g.o.vy = 0; } // 下がる分は手で持っているので即座に
        g.o.y = base + g.dy;
      }
      startFall();
      requestDraw();
    }
    return;
  }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (mode === 'orbit') {
    cam.yaw -= dx * 0.005;
    cam.pitch += dy * 0.005;
    cam.pitch = Math.min(Math.max(cam.pitch, 0.05), 1.5);
  } else {
    // 画面上の動きを地面上の前後左右に変換 (掴んだ地面が付いてくるように)
    const k = cam.dist * 0.0015;
    const fx = -Math.cos(cam.yaw), fz = -Math.sin(cam.yaw); // 地面上の前方向
    const rx = -fz, rz = fx;                               // 地面上の右方向
    cam.tx += -rx * dx * k + fx * dy * k;
    cam.tz += -rz * dx * k + fz * dy * k;
  }
  drag.x = e.clientX;
  drag.y = e.clientY;
  requestDraw();
});
// クリックした立方体の色を次の色に変える。
// ダブルクリック・ダブルタップ (削除) と区別するため、少し待ってから変える
const DOUBLE_TAP_MS = 300;
let wasDragged = false;
let colorTimer = 0;
let ignoreClicksUntil = 0; // ダブルタップで削除した直後のクリックは無視する
canvas.addEventListener('click', e => {
  if (wasDragged || e.detail > 1 || performance.now() < ignoreClicksUntil) return;
  const picked = pickBox(screenRay(e.clientX, e.clientY));
  if (!picked) return;
  clearTimeout(colorTimer);
  const { clientX: x, clientY: y } = e;
  colorTimer = setTimeout(() => {
    if (lastPointerType === 'touch') {
      // スマホ: パレットを出して色を選ぶ
      openPicker(picked.box, x, y);
    } else {
      // マウス: 次の色に変える
      picked.box.c = (picked.box.c + 1) % PALETTE.length;
      requestDraw();
    }
  }, DOUBLE_TAP_MS);
});
function deleteBox(box, x, y) {
  if (pickerBox === box) closePicker();
  clearTimeout(colorTimer);
  boxes.splice(boxes.indexOf(box), 1);
  settle();
  canvas.classList.toggle('over-box', !!pickBox(screenRay(x, y)));
  updateAddButton();
  requestDraw();
}
// ダブルクリックした立方体を削除 (タッチはブラウザによって dblclick が来ないので、下のダブルタップで扱う)
let lastPointerType = 'mouse';
canvas.addEventListener('dblclick', e => {
  if (lastPointerType === 'touch') return;
  const picked = pickBox(screenRay(e.clientX, e.clientY));
  if (picked) deleteBox(picked.box, e.clientX, e.clientY);
});
// 同じ立方体を素早く2回タップしたら削除
let lastTap = null;
function handleTap(e) {
  const picked = pickBox(screenRay(e.clientX, e.clientY));
  const now = performance.now();
  if (picked && lastTap && lastTap.box === picked.box && now - lastTap.t < DOUBLE_TAP_MS &&
      Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
    lastTap = null;
    ignoreClicksUntil = now + 400;
    deleteBox(picked.box, e.clientX, e.clientY);
    return;
  }
  lastTap = picked ? { box: picked.box, t: now, x: e.clientX, y: e.clientY } : null;
}
const endDrag = e => {
  pointers.delete(e.pointerId);
  lastPointerType = e.pointerType;
  if (!drag) return;
  const two = drag.twist || drag.pinch;
  if (two) {
    // ひねり・ピンチは、指のどちらかを離したら終わり (残った指はそのまま離すまで何もしない)
    if (!two.ids.includes(e.pointerId)) return;
    wasDragged = true;
  } else {
    if (e.pointerId !== drag.id) return;
    // 少し以上動いたらドラッグ扱いにして、クリックで色を変えない (指はぶれやすいので広めに)
    // 長押しで掴んだあとは、動かさずに離してもタップ扱いにしない
    const slop = e.pointerType === 'touch' ? 10 : 4;
    wasDragged = drag.grabbed || Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > slop;
    if (!wasDragged && e.type === 'pointerup' && e.pointerType === 'touch') handleTap(e);
  }
  if (drag.pending) clearTimeout(drag.pending.timer);
  if (drag.box || drag.rot || drag.twist) settle();
  drag = null;
  requestDraw();
  canvas.classList.remove('dragging');
};
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault()); // 長押しでメニューを出さない
// カメラの距離を factor 倍にする (ホイールとピンチで共通)
function zoomBy(factor) {
  cam.dist = Math.min(Math.max(cam.dist * factor, 2), 60);
  requestDraw();
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(Math.exp(e.deltaY * 0.001));
}, { passive: false });

let pending = false;
function requestDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}

function render() {
  gl.uniform3f(uTarget, cam.tx, 0, cam.tz);
  gl.uniform3f(uCam, ...camPos());
  if (boxes.length) {
    gl.uniform3fv(uBoxes, boxes.flatMap(b => [b.x, b.py, b.z]));
    gl.uniform3fv(uColors, boxes.flatMap(b => PALETTE[b.c]));
    gl.uniform1fv(uRots, boxes.map(b => b.r));
    gl.uniform1iv(uShapes, boxes.map(b => b.s));
    const held = drag?.box?.box ?? drag?.rot?.box ?? drag?.twist?.box ?? pickerBox;
    gl.uniform1i(uSel, held ? boxes.indexOf(held) : -1);
  }
  gl.uniform1i(uCount, boxes.length);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  render();
}
addEventListener('resize', draw);
draw();
</script>
