<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Shader</title>
<style>
  /* 背景は、以前シェーダーで描いていた縦のグラデーションと同じ色 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(to top, #3b414c, #5a6172); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none;
           -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.pan { cursor: move; }
  canvas.over-box { cursor: pointer; }
  .modes, .shapes {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 2px; padding: 3px;
    background: rgba(20, 24, 32, 0.85); border: 1px solid #2c3340; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .modes button, .shapes button {
    font: 13px/1 system-ui, sans-serif; color: #9aa4b5;
    background: transparent; border: 0; border-radius: 7px;
    padding: 9px 14px; cursor: pointer;
  }
  .modes button:hover, .shapes button:hover { color: #dce3ee; }
  .shapes { bottom: 66px; }
  .modes button[aria-pressed="true"], .shapes button[aria-pressed="true"] { background: #3a4558; color: #fff; }
  .modes .sep, .shapes .sep { width: 1px; margin: 4px 3px; background: #2c3340; }
  .modes button:disabled, .shapes button:disabled { opacity: 0.4; cursor: default; }
  /* 幅の狭いスマホでは、ボタンの左右の余白を詰めて 1 段に収める */
  @media (max-width: 400px) {
    .modes button, .shapes button { padding: 9px 10px; }
  }
  .palette {
    position: fixed; display: grid; grid-template-columns: repeat(4, 40px); gap: 8px; padding: 10px;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 12px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .palette[hidden] { display: none; }
  .palette button {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.15);
  }
  .palette button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px 14px;
    font: 13px/1.5 system-ui, sans-serif; color: #dce3ee; overflow-wrap: anywhere;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 10px;
  }
  .toast[hidden] { display: none; }
  .fx {
    position: fixed; right: 16px; bottom: 116px;
    display: grid; grid-template-columns: auto minmax(120px, 160px); align-items: center; gap: 2px 10px; padding: 3px 12px 3px 3px;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .fx[hidden] { display: none; }
  .fx button {
    font: 13px/1 system-ui, sans-serif; color: #9aa4b5;
    background: transparent; border: 0; border-radius: 7px;
    padding: 10px 14px; cursor: pointer; text-align: left;
  }
  .fx button:hover { color: #dce3ee; }
  .fx button[aria-pressed="true"] { background: #3a4558; color: #fff; }
  .fx input[type="range"] { width: 100%; margin: 0; accent-color: #8fa2c4; }
  .fx input[type="range"].off { opacity: 0.45; }
  .modes button[aria-expanded="true"] { color: #fff; }
  .morphs {
    position: fixed; right: 16px; bottom: 116px; width: min(320px, calc(100vw - 32px));
    max-height: min(60vh, 460px); display: flex; flex-direction: column;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none; font: 13px/1.3 system-ui, sans-serif; color: #dce3ee;
  }
  .morphs[hidden] { display: none; }
  .morphs-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px 12px; }
  .morphs-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .morphs button {
    font: inherit; color: #9aa4b5; background: transparent; border: 0; border-radius: 7px;
    padding: 7px 10px; cursor: pointer;
  }
  .morphs button:hover { color: #dce3ee; }
  .morphs-tabs { display: flex; gap: 2px; padding: 0 6px 6px; border-bottom: 1px solid #2c3340; }
  .morphs-tabs button[aria-selected="true"] { background: #3a4558; color: #fff; }
  .morphs-tabs button:disabled { opacity: 0.35; cursor: default; }
  .morphs-list { overflow-y: auto; padding: 6px 12px 10px; display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 4px 10px; align-items: center; }
  .morphs-list label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .morphs-list input[type="range"] { width: 100%; margin: 0; accent-color: #8fa2c4; }
  .morphs-empty { grid-column: 1 / -1; color: #9aa4b5; padding: 8px 0; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<div class="palette" id="palette" role="group" aria-label="色" hidden></div>
<div class="shapes" role="group" aria-label="追加する形">
  <button type="button" data-shape="0" aria-pressed="true">立方体</button>
  <button type="button" data-shape="1" aria-pressed="false">トーラス</button>
  <button type="button" data-shape="2" aria-pressed="false">三角錐</button>
  <span class="sep"></span>
  <button type="button" id="load-pmx" aria-label="MMD のモデル (.pmx)・モーション (.vmd)・曲を読み込む">MMD…</button>
  <button type="button" id="music" aria-label="曲とモーションを一時停止" hidden>⏸</button>
</div>
<input type="file" id="pmx-input" multiple hidden
       accept=".pmx,.vmd,.png,.jpg,.jpeg,.bmp,.tga,.gif,.spa,.sph,image/*,.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac,.opus,audio/*">
<div class="morphs" id="morph-panel" role="dialog" aria-labelledby="morph-title" hidden>
  <div class="morphs-head">
    <span id="morph-title">表情</span>
    <button type="button" id="morph-zero">すべて0に戻す</button>
    <button type="button" id="morph-close" aria-label="表情のパネルを閉じる">×</button>
  </div>
  <div class="morphs-tabs" role="tablist" aria-label="表情の分類">
    <button type="button" role="tab" data-panel="1">眉</button>
    <button type="button" role="tab" data-panel="2">目</button>
    <button type="button" role="tab" data-panel="3">口</button>
    <button type="button" role="tab" data-panel="4">その他</button>
  </div>
  <div class="morphs-list" id="morph-list" role="tabpanel"></div>
</div>
<div class="fx" id="fx-panel" role="group" aria-label="効果 (MME 風)" hidden>
  <button type="button" data-fx="bloom" aria-pressed="false">光る</button>
  <input type="range" data-fx-level="bloom" min="0" max="2" step="0.05" aria-label="光るの強さ">
  <button type="button" data-fx="diffusion" aria-pressed="false">ふんわり</button>
  <input type="range" data-fx-level="diffusion" min="0" max="1" step="0.02" aria-label="ふんわりの強さ">
  <button type="button" data-fx="dof" aria-pressed="false">被写界深度</button>
  <input type="range" data-fx-level="dof" min="0" max="3" step="0.05" aria-label="被写界深度のぼけの大きさ">
  <button type="button" data-fx="ao" aria-pressed="false">影の濃さ</button>
  <input type="range" data-fx-level="ao" min="0" max="2" step="0.05" aria-label="影の濃さ">
</div>
<div class="modes" role="group" aria-label="操作モード">
  <button type="button" data-mode="orbit" aria-pressed="true">回転</button>
  <button type="button" data-mode="pan" aria-pressed="false">移動</button>
  <span class="sep"></span>
  <button type="button" id="add">追加</button>
  <button type="button" id="fx-toggle" aria-expanded="false" aria-controls="fx-panel">効果</button>
  <button type="button" id="reset">リセット</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch {
  document.body.textContent = 'WebGL2 に対応していません';
  throw new Error('WebGL2 unavailable');
}
renderer.setClearColor(0x000000, 0); // 背景は CSS のグラデーションを見せる
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// MMD モデルの輪郭線。太さ・色・表示の有無は、MMDLoader が .pmx の材質から読んで
// material.userData.outlineParameters に入れてくれる。それ以外の物は noOutline() で輪郭線を付けない
// (userData は材質ごとに書き込むので、毎回新しいオブジェクトを渡す)
const outline = new OutlineEffect(renderer);
const noOutline = () => ({ outlineParameters: { visible: false } });

const scene = new THREE.Scene();
// 以前のシェーダーと同じ画角 (画面の高さに対して焦点距離 1.6)
const DEFAULT_FOV = 2 * Math.atan(0.5 / 1.6) * 180 / Math.PI;
const camera = new THREE.PerspectiveCamera(DEFAULT_FOV, 1, 0.05, 1000);

// --- 光 ---
const LIGHT = new THREE.Vector3(0.6, 1.0, 0.35).normalize();
scene.add(new THREE.AmbientLight(0xffffff, 0.18 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 0.82 * Math.PI);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// --- 地面のグリッド (以前のシェーダーと同じ線・軸・フェード) ---
const grid = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    userData: noOutline(),
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vWorld;
      // 線幅(ピクセル単位)を一定に保つアンチエイリアス付きグリッド
      float grid(vec2 p, float lineWidth) {
        vec2 d = fwidth(p);
        vec2 g = abs(fract(p - 0.5) - 0.5) / d;
        float line = min(g.x, g.y);
        return 1.0 - clamp(line - lineWidth + 1.0, 0.0, 1.0);
      }
      void main() {
        vec2 p = vWorld.xz;
        vec3 c = vec3(0.07, 0.08, 0.10);
        c = mix(c, vec3(0.30, 0.34, 0.42), grid(p, 1.0));
        c = mix(c, vec3(0.55, 0.62, 0.75), grid(p / 5.0, 1.5));
        // 原点の軸 (X: 赤, Z: 青)
        vec2 ad = abs(p) / fwidth(p);
        c = mix(c, vec3(0.90, 0.30, 0.30), 1.0 - clamp(ad.y - 1.0, 0.0, 1.0));
        c = mix(c, vec3(0.30, 0.50, 0.95), 1.0 - clamp(ad.x - 1.0, 0.0, 1.0));
        // 遠くほど透明にして背景に溶かす
        float fade = exp(-distance(cameraPosition, vWorld) * 0.035);
        // 色はリニアで出し、画面用・後処理用の変換は three.js に任せる
        gl_FragColor = vec4(c, fade);
        #include <colorspace_fragment>
      }`,
  }),
);
// 地面に落ちる影 (グリッドの上に重ねる)
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.55, depthWrite: false, userData: noOutline() }),
);
shadowPlane.receiveShadow = true;
shadowPlane.position.y = 0.0005;
shadowPlane.renderOrder = 1;
scene.add(grid, shadowPlane);

// --- 色 ---
// 色はリニア値
const PALETTE = [
  [0.85, 0.62, 0.32], // 黄土
  [0.85, 0.22, 0.18], // 赤
  [0.12, 0.58, 0.52], // 青緑
  [0.18, 0.32, 0.85], // 青
  [0.55, 0.28, 0.80], // 紫
  [0.35, 0.70, 0.22], // 緑
  [0.90, 0.32, 0.55], // ピンク
  [0.62, 0.66, 0.72], // 灰
];
const PALETTE_NAMES = ['黄土', '赤', '青緑', '青', '紫', '緑', 'ピンク', '灰'];

// --- お知らせ (読み込み中・エラーなど) ---
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(text, ms = 4000) {
  toastEl.textContent = text;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
}

// --- 色選び (スマホで形をタップしたときに出すパレット) ---
const paletteEl = document.getElementById('palette');
let pickerBox = null; // パレットで色を変えている形
const swatches = PALETTE.map((c, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', PALETTE_NAMES[i]);
  b.style.background = `rgb(${c.map(v => Math.round(Math.pow(v, 1 / 2.2) * 255)).join(',')})`;
  b.addEventListener('click', () => {
    if (pickerBox) pickerBox.c = i;
    closePicker();
  });
  paletteEl.append(b);
  return b;
});
function openPicker(box, x, y) {
  pickerBox = box;
  swatches.forEach((b, i) => b.setAttribute('aria-pressed', i === box.c));
  paletteEl.hidden = false;
  // タップした位置の上に出す。画面からはみ出す場合は下に出し、左右は端から 16px 以上離す
  const w = paletteEl.offsetWidth, h = paletteEl.offsetHeight;
  paletteEl.style.left = `${Math.min(Math.max(x - w / 2, 16), innerWidth - w - 16)}px`;
  paletteEl.style.top = `${y - h - 24 >= 16 ? y - h - 24 : Math.min(y + 24, innerHeight - h - 16)}px`;
  requestDraw();
}
function closePicker() {
  if (paletteEl.hidden) return;
  paletteEl.hidden = true;
  pickerBox = null;
  requestDraw();
}
addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
// まだ使われていない色を優先し、全色使用中なら一番使われていない色を選ぶ
function nextColor() {
  const used = PALETTE.map((_, i) => boxes.filter(b => b.c === i).length);
  return used.indexOf(Math.min(...used));
}
const MAX_BOXES = 32;

// オービットカメラ (注視点を中心に回転 / 地面に沿って移動)
// ty は注視点の高さ (ふだんは地面の 0。カメラモーションから引き継いだときだけ浮く)
const CAM_DEFAULT = { yaw: Math.PI / 4, pitch: 0.6, dist: 9.8, tx: 0, ty: 0, tz: 0, fov: DEFAULT_FOV };
const cam = { ...CAM_DEFAULT };
document.getElementById('reset').addEventListener('click', () => {
  stopMusic();
  stopCameraMotion(false);
  closeMorphPanel();
  closePicker();
  Object.assign(cam, CAM_DEFAULT);
  while (boxes.length) removeObject(boxes[0]);
  removeStage();
  boxes.push(makeBox(0, 0, 0));
  updateAddButton();
  requestDraw();
});

let mode = 'orbit';
const modeButtons = document.querySelectorAll('.modes button[data-mode]');
function setMode(m) {
  mode = m;
  modeButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  canvas.classList.toggle('pan', m === 'pan');
}
modeButtons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// --- 置いた物 (形と PMX モデル) ---
// x, z は底面中心、y は積み重ねで決まる高さ、py は画面に表示している高さ (落下中は y より上)、vy は落下速度
// r は縦軸まわりの回転角 (ラジアン)、c は色 (モデルは -1)
// s は種類 (0: 立方体, 1: トーラス, 2: 三角錐, 3: PMX モデル)
// h は高さ、hx / hz は上から見た足場の半分の幅 (回転前)
// node は three.js の表示用オブジェクト
const SHAPE_GEOMETRY = [
  new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0),
  // 寝かせたトーラス: 中心円の半径 0.35、管の半径 0.15 (高さ 0.3)
  new THREE.TorusGeometry(0.35, 0.15, 24, 64).rotateX(Math.PI / 2).translate(0, 0.15, 0),
  // 三角錐: 底面は外接円の半径 0.5 の正三角形、高さ 0.8
  new THREE.ConeGeometry(0.5, 0.8, 3, 1).translate(0, 0.4, 0),
];
const SHAPE_HEIGHT = [1, 0.3, 0.8];
function makeNode(obj, object3d) {
  const node = new THREE.Group();
  node.add(object3d);
  node.userData.obj = obj;
  object3d.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(node);
  obj.node = node;
  return obj;
}
function makeBox(x, z, c, s = 0) {
  const obj = { x, y: 0, z, c, s, r: 0, py: 0, vy: 0, h: SHAPE_HEIGHT[s], hx: 0.5, hz: 0.5 };
  const mesh = new THREE.Mesh(SHAPE_GEOMETRY[s], new THREE.MeshLambertMaterial({ flatShading: s === 2, userData: noOutline() }));
  obj.mesh = mesh;
  return makeNode(obj, mesh);
}
function removeObject(obj) {
  scene.remove(obj.node);
  stopPhysics(obj);
  stopMotion(obj);
  if (obj.s === 3) {
    disposeModel(obj.node);
  } else {
    obj.mesh.material.dispose();
  }
  boxes.splice(boxes.indexOf(obj), 1);
}
// MMD モデルの形状・材質・テクスチャを片付ける
function disposeModel(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    for (const m of [o.material].flat()) {
      // MMD の材質はテクスチャを uniforms の中に持っている
      for (const v of [...Object.values(m), ...Object.values(m.uniforms ?? {}).map(u => u.value)]) {
        if (v?.isTexture) v.dispose();
      }
      m.dispose();
    }
  });
}
const topOf = b => b.y + b.h; // 上に載せられる高さ

// 追加する形の選択
let currentShape = 0;
const shapeButtons = document.querySelectorAll('.shapes button[data-shape]');
shapeButtons.forEach(b => b.addEventListener('click', () => {
  currentShape = +b.dataset.shape;
  shapeButtons.forEach(o => o.setAttribute('aria-pressed', o === b));
}));
const boxes = [makeBox(0, 0, 0)];

// --- 積み重ね ---
// 上から見て足場が重なっているか (回転した長方形どうしを分離軸判定で調べる)
function overlaps(a, b) {
  const e = 0.0005; // 辺がちょうど接しているだけなら重なりとしない
  const axes = r => [[Math.cos(r), -Math.sin(r)], [Math.sin(r), Math.cos(r)]];
  const aa = axes(a.r), ba = axes(b.r);
  const d = [b.x - a.x, b.z - a.z];
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1];
  for (const u of [...aa, ...ba]) {
    const ra = (a.hx - e) * Math.abs(dot(u, aa[0])) + (a.hz - e) * Math.abs(dot(u, aa[1]));
    const rb = (b.hx - e) * Math.abs(dot(u, ba[0])) + (b.hz - e) * Math.abs(dot(u, ba[1]));
    if (Math.abs(dot(d, u)) >= ra + rb) return false;
  }
  return true;
}
// b の上に (直接または間接的に) 載っている物と b 自身
function stackFrom(b) {
  const group = [b];
  for (let i = 0; i < group.length; i++) {
    const s = group[i];
    for (const o of boxes) {
      if (!group.includes(o) && overlaps(o, s) && Math.abs(o.y - topOf(s)) < 1e-3) group.push(o);
    }
  }
  return group;
}
// 重力: 下にあるものから順に、足場の一番高い所まで落とす (exclude は動かさない)
function settle(exclude = []) {
  const placed = [];
  for (const b of boxes.filter(b => !exclude.includes(b)).sort((a, b) => a.y - b.y)) {
    b.y = Math.max(0, ...placed.filter(o => overlaps(o, b)).map(topOf));
    placed.push(b);
  }
  startFall();
}

// 落下アニメーション: 表示上の高さ py を、重力で y まで落とす (着地で少し跳ねる)。
// 上がるときは y より少し高くまで跳び上がってから、同じ重力で着地する
const GRAVITY = 40;
const HOP = 0.25; // 跳び乗るときに y より上へ跳ぶ高さ
let falling = false, lastTime = 0;
function startFall() {
  for (const b of boxes) {
    if (b.py >= b.y) continue;
    const v0 = Math.sqrt(2 * GRAVITY * (b.y - b.py + HOP));
    if (b.vy > -v0) b.vy = -v0; // vy は下向きが正
  }
  if (falling || !boxes.some(b => b.py !== b.y || b.vy !== 0)) return;
  falling = true;
  lastTime = 0;
  requestAnimationFrame(fallStep);
}
function fallStep(now) {
  // 最初のフレームは基準時刻だけ取る (rAF の時刻は performance.now() より前のことがある)
  const dt = lastTime ? Math.min(Math.max(now - lastTime, 0) / 1000, 1 / 30) : 0;
  lastTime = now;
  let moving = false;
  for (const b of boxes) {
    if (b.py === b.y && b.vy === 0) continue;
    b.vy += GRAVITY * dt;
    b.py -= b.vy * dt;
    if (b.vy > 0 && b.py <= b.y) {
      b.py = b.y;
      b.vy = b.vy > 3 ? -b.vy * 0.25 : 0; // 速ければ小さく跳ね返る
    }
    if (b.py !== b.y || b.vy !== 0) moving = true;
  }
  render();
  if (moving) requestAnimationFrame(fallStep);
  else falling = false;
}

// 画面中央 (注視点) に近い、ほかの物と重ならないマス目を探す (半径 rad の物を置く)
const radiusOf = b => Math.hypot(b.hx, b.hz);
function findFreeSpot(rad, cx = Math.round(cam.tx), cz = Math.round(cam.tz)) {
  const free = (x, z) => boxes.every(b => Math.max(Math.abs(b.x - x), Math.abs(b.z - z)) >= radiusOf(b) + rad + 0.1);
  for (let r = 0; r < 40; r++) {
    for (let i = -r; i <= r; i++) {
      for (const [x, z] of [[cx + i, cz - r], [cx + i, cz + r], [cx - r, cz + i], [cx + r, cz + i]]) {
        if (free(x, z)) return [x, z];

    }
  }
  return [cx, cz];
}

function camPos() {
  const cp = Math.cos(cam.pitch);
  return [
    cam.tx + cam.dist * cp * Math.cos(cam.yaw),
    cam.ty + cam.dist * Math.sin(cam.pitch),
    cam.tz + cam.dist * cp * Math.sin(cam.yaw)];
}
function updateCamera() {
  if (camMotion) { applyCameraMotion(); return; }
  if (camera.fov !== cam.fov) { camera.fov = cam.fov; camera.updateProjectionMatrix(); }
  camera.up.set(0, 1, 0);
  camera.position.set(...camPos());
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  camera.updateMatrixWorld();
}
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function screenRay(cx, cy) {
  updateCamera();
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return { ro: raycaster.ray.origin.toArray(), rd: raycaster.ray.direction.toArray() };
}
// 一番手前で当たる物 { box, t } (なければ null)。three.js のレイキャストで、見た目の形どおりに判定する
function pickBox({ ro, rd }) {
  raycaster.ray.origin.fromArray(ro);
  raycaster.ray.direction.fromArray(rd);
  const hit = raycaster.intersectObjects(boxes.map(b => b.node), true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !o.userData.obj) o = o.parent;
  return o ? { box: o.userData.obj, t: hit.distance } : null;

// レイと水平面 y = h の交点 (xz)。面と平行なら null
function rayPlane({ ro, rd }, h) {
  if (Math.abs(rd[1]) < 1e-6) return null;
  const t = (h - ro[1]) / rd[1];
  return t > 0 ? [ro[0] + rd[0] * t, ro[2] + rd[2] * t] : null;

const rotationGroup = b =>
  ({ box: b, group: stackFrom(b).map(o => ({ o, dx: o.x - b.x, dz: o.z - b.z, r: o.r })) });
// 回し始めからの角度 a (ラジアン) だけ回す
function rotateGroup({ box, group }, a) {
  const c = Math.cos(a), sn = Math.sin(a);
  for (const g of group) {
    g.o.x = box.x + g.dx * c + g.dz * sn;
    g.o.z = box.z - g.dx * sn + g.dz * c;
    g.o.r = g.r + a;

}
const pointerAngle = ([a, b]) => {
  const p = pointers.get(a), q = pointers.get(b);
  return Math.atan2(q.y - p.y, q.x - p.x);
};
const pointerDistance = ([a, b]) => {
  const p = pointers.get(a), q = pointers.get(b);
  return Math.max(Math.hypot(q.x - p.x, q.y - p.y), 1);
};

async function loadPmx(files) {

  if (!pmx) { toast('.pmx ファイルが選ばれていません。モデルの .pmx とテクスチャ画像をまとめて選んでください。'); return; }
  toast(`${pmx.name} を読み込み中…`, 0);

  } catch (err) {
    console.error(err);
    toast(`${pmx.name} を読み込めませんでした: ${err?.message ?? err}`, 8000);
  }
}
// モーフ (表情など) が1つもないモデルでも、MMDLoader は空のモーフ情報を付ける。
// three.js はそれを「モーフあり」として扱い、シェーダーの組み立てに失敗するので取り除く
function fixEmptyMorphs(mesh) {
  mesh.traverse(o => {
    if (!o.geometry) return;
    const ma = o.geometry.morphAttributes;
    for (const k of Object.keys(ma)) if (!ma[k].length) delete ma[k];
    // (表情の対応表は空のまま残す。消すと、表情の動きを含む .vmd を読むときに MMDLoader が止まる)
    if (o.morphTargetInfluences?.length === 0) { o.morphTargetInfluences = undefined; o.morphTargetDictionary = {}; }
  });
}
function addModel(mesh) {
  // MMD_SCALE 倍にして、足元の中心が置き場所に来るようにずらす
  const bbox = new THREE.Box3().setFromObject(mesh);
  const size = bbox.getSize(new THREE.Vector3()), center = bbox.getCenter(new THREE.Vector3());
  const k = MMD_SCALE;
  mesh.scale.setScalar(k);
  mesh.position.set(-center.x * k, -bbox.min.y * k, -center.z * k);
  const obj = { x: 0, y: 0, z: 0, c: -1, s: 3, r: 0, py: 0, vy: 0,
                h: size.y * k, hx: Math.max(size.x * k / 2, 0.05), hz: Math.max(size.z * k / 2, 0.05) };
  // ステージがあるときは、ステージの中心 (MMD で人物が立つ原点) の近くに置く
  [obj.x, obj.z] = stageModel ? findFreeSpot(radiusOf(obj), 0, 0) : findFreeSpot(radiusOf(obj));
  makeNode(obj, mesh);
  obj.model = mesh;
  // 当たり判定用の複製。置いたモデルはポーズを変えないので、骨やモーフの計算をしない普通のメッシュで判定する
  // (骨で変形するメッシュのまま判定すると、頂点ごとに骨を計算するので 9 万ポリゴンで 1 回 50ms ほどかかる)
  const proxy = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial());
  proxy.morphTargetInfluences = undefined;
  proxy.position.copy(mesh.position);
  proxy.scale.copy(mesh.scale);
  proxy.visible = false;
  proxy.castShadow = false;
  obj.node.add(proxy);
  mesh.traverse(o => { if (o.isMesh) o.raycast = () => {}; });
  boxes.push(obj);
  dropIn(obj);
  return obj;
}

// --- MMD の物理演算 (髪やスカートの揺れ) ---
// 物理エンジン Ammo.js (WebAssembly 版) は大きいので、剛体を持つモデルを初めて読んだときに取りに行く
const AMMO_URL = 'https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/libs/ammo.wasm.js';
let ammoReady = null;
function loadAmmo() {
  ammoReady ??= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = AMMO_URL;
    script.onload = () => window.Ammo().then(lib => { window.Ammo = lib; resolve(lib); }, reject);
    script.onerror = () => reject(new Error('Ammo.js を読み込めませんでした'));
    document.head.append(script);
  });
  return ammoReady;
}
let MMDPhysics = null;
const physicsList = []; // { obj, physics, prev, vel, acc, gravity }
const MMD_GRAVITY = 9.8 * 10; // MMD の重力 (モデルの単位で)
const INERTIA = 0.3;          // 運ぶ・落ちるときの揺れの強さ
const ROT_INERTIA = 0.5;      // 回すときの揺れの強さ
async function startPhysics(obj, mesh) {
  const mmd = mesh.geometry.userData.MMD;
  if (!mmd?.rigidBodies?.length) return; // 剛体のないモデルは動かさない
  try {
    const Ammo = await loadAmmo();
    MMDPhysics ??= (await import('three/addons/animation/MMDPhysics.js')).MMDPhysics;
    if (!boxes.includes(obj)) return; // 読み込み中に消された
    // MMDPhysics は、拡大縮小していないモデル自身の座標で剛体を作る。
    // update() のときと同じように、いったん親から外して大きさを 1 に戻してから作る
    const parent = mesh.parent, scale = mesh.scale.clone();
    mesh.parent = null;
    mesh.scale.set(1, 1, 1);
    mesh.updateMatrixWorld(true);
    let physics;
    try {
      physics = new MMDPhysics(mesh, mmd.rigidBodies, mmd.constraints);
    } finally {
      mesh.parent = parent;
      mesh.scale.copy(scale);
      obj.node.updateMatrixWorld(true);
    }
    physics.warmup(60); // 最初の姿勢になじませる
    // 物理演算の座標 (拡大縮小を外したモデル自身の座標) での、置き場所の回転軸 (縦軸) の位置。
    // メッシュは置き場所から mesh.position だけずらして k 倍しているので、置き場所の原点はここに来る
    const k = mesh.scale.x;
    physicsList.push({
      obj, physics, scale: 1 / k,
      prev: null, vel: new THREE.Vector3(), acc: new THREE.Vector3(),
      gravity: new Ammo.btVector3(0, -MMD_GRAVITY, 0), // 毎フレーム作り直すと Ammo のメモリが増え続けるので使い回す
      force: new Ammo.btVector3(0, 0, 0),
      axisX: mesh.position.x * (1 - 1 / k), axisZ: mesh.position.z * (1 - 1 / k),
      prevR: null, w: 0, alpha: 0,
      dynamic: physics.bodies.filter(b => b.params.type !== 0), // 骨に付いていくだけの剛体は除く
    });
    startTicking();
  } catch (err) {
    console.error(err);
    toast(`物理演算を開始できませんでした: ${err?.message ?? err}`, 8000);
  }
}
// --- VMD モーションの再生 ---
// MMDAnimationHelper が、モーションの再生・IK (足の接地など)・付与 (連動する骨) を計算する。
// 物理演算は上の仕組みのまま、モーションのあとに計算する
let animHelper = null;
async function playMotions(vmds, objs) {
  const label = vmds.map(f => f.name).join('、');
  toast(`${label} を読み込み中…`, 0);
  try {
    mmdLoaderModule ??= await import('three/addons/loaders/MMDLoader.js');
    const { MMDAnimationHelper } = await import('three/addons/animation/MMDAnimationHelper.js');
    animHelper ??= new MMDAnimationHelper();
    const loader = new mmdLoaderModule.MMDLoader();
    let used = false, hasModelMotion = false;
    for (const file of vmds) {
      const url = URL.createObjectURL(file);
      let vmd;
      try {
        vmd = await new Promise((resolve, reject) => loader.loadVMD(url, resolve, undefined, reject));
      } finally {
        URL.revokeObjectURL(url);
      }
      // カメラの動き
      if (vmd.metadata.cameraCount > 0) {
        startCameraMotion(loader.animationBuilder.buildCameraAnimation(vmd));
        used = true;
      }
      // モデルの動き (骨と表情)
      if (vmd.metadata.motionCount + vmd.metadata.morphCount > 0) {
        hasModelMotion = true;
        for (const obj of objs) {
          if (!boxes.includes(obj)) continue; // 読み込み中に消された
          const mesh = obj.model;
          const clip = loader.animationBuilder.build(vmd, mesh);
          if (!clip.tracks.length) continue; // 骨や表情の名前が1つも合わない
          if (animHelper.objects.has(mesh)) animHelper.remove(mesh);
          mesh.pose(); // 前のモーションの姿勢を元に戻してから付ける
          animHelper.add(mesh, { animation: clip, physics: false });
          obj.animated = true;
          used = true;
        }
      }
    }
    if (!used) {
      toast(hasModelMotion && !objs.length
        ? '先に .pmx のモデルを読み込んでください。'
        : `${label} には、このモデルの骨や表情に合う動きも、カメラの動きもありませんでした`, 8000);
      return false;
    }
    restartMotions();
    if (music) { music.currentTime = 0; motionClock = 0; } // 曲も最初から
    toast(`${label} を再生しています${camMotion ? '。カメラを自分で動かすと、カメラモーションは止まります' : ''}`, 6000);
    startTicking();
    return true;
  } catch (err) {
    console.error(err);
    toast(`${label} を読み込めませんでした: ${err?.message ?? err}`, 8000);
    return false;
  }
}
// ダンスとカメラがずれないように、すべてのモーションを最初から再生し直す
function restartMotions() {
  // (animHelper.objects は WeakMap で中身をたどれないので、再生中のモデルとカメラを自分で並べる)
  const targets = [...boxes.filter(b => b.animated).map(b => b.model), ...(camMotion ? [camMotion.cam] : [])];
  for (const t of targets) animHelper.objects.get(t)?.mixer?.setTime(0);
  animHelper.update(0);
  // 最初のフレームの姿勢に、物理演算の剛体を合わせる
  for (const p of physicsList) {
    if (!p.obj.animated) continue;
    p.obj.node.updateMatrixWorld(true);
    p.physics.reset();
    p.physics.warmup(30);
  }
}

// --- VMD のカメラモーション ---
// MMD のカメラは、モデルが原点に立っている MMD の単位の座標で動く。
// 置いてある最初のモデルと同じ変換 (大きさ・向き・置き場所) をかけて、このページのカメラに写す
let camMotion = null; // { cam: MMD の座標で動くカメラ }
function startCameraMotion(clip) {
  if (camMotion) animHelper.remove(camMotion.cam);
  const mmdCam = new THREE.PerspectiveCamera(DEFAULT_FOV);
  animHelper.add(mmdCam, { animation: clip });
  camMotion = { cam: mmdCam };
}
const _stage = new THREE.Matrix4(), _target = new THREE.Vector3(), _up = new THREE.Vector3();
function stageMatrix() {
  // ステージがあるときは、ステージの原点を基準にする
  if (stageModel) return _stage.copy(stageModel.matrixWorld);
  const model = boxes.find(b => b.s === 3);
  if (model) {
    model.node.updateMatrixWorld(true);
    return _stage.copy(model.model.matrixWorld);
  }
  // モデルがないときは、原点に身長 20 (MMD のモデルのよくある大きさ) のモデルが立っているとみなす
  return _stage.makeScale(MMD_SCALE, MMD_SCALE, MMD_SCALE);
}

// --- 表情 (モーフ) を手で動かす ---
// モデルをクリック (タップ) すると開く。VMD で動かしている表情は、モーション側が優先される
const morphPanel = document.getElementById('morph-panel');
const morphList = document.getElementById('morph-list');
const morphTabs = morphPanel.querySelectorAll('[data-panel]');
let morphObj = null, morphTab = 2;
function morphsOf(obj) {
  const mesh = obj.model, panels = mesh.userData.morphPanels;
  return Object.entries(mesh.morphTargetDictionary ?? {}).map(([name, index]) => ({
    name, index, panel: panels?.get(name) || 4, // 分類が分からないものは「その他」に
  }));
}
function openMorphPanel(obj) {
  closeFxPanel();
  closePicker();
  morphObj = obj;
  document.getElementById('morph-title').textContent = `${obj.model.name || 'モデル'} の表情`;
  const counts = [0, 0, 0, 0, 0];
  for (const m of morphsOf(obj)) counts[m.panel]++;
  morphTabs.forEach(t => { t.disabled = !counts[+t.dataset.panel]; });
  // 前に開いていた分類に表情がなければ、表情のある最初の分類にする
  if (!counts[morphTab]) morphTab = [2, 3, 1, 4].find(i => counts[i]) ?? 2;
  showMorphTab(morphTab);
  morphPanel.hidden = false;
}
function showMorphTab(panel) {
  morphTab = panel;
  morphTabs.forEach(t => t.setAttribute('aria-selected', String(+t.dataset.panel === panel)));
  morphList.replaceChildren();
  const list = morphsOf(morphObj).filter(m => m.panel === panel);
  if (!list.length) {
    const p = document.createElement('div');
    p.className = 'morphs-empty';
    p.textContent = morphsOf(morphObj).length ? 'この分類の表情はありません' : 'このモデルには表情がありません';
    morphList.append(p);
    return;
  }
  const influences = morphObj.model.morphTargetInfluences;
  for (const m of list) {
    const id = `morph-${m.index}`;
    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = m.name;
    label.title = m.name;
    const range = document.createElement('input');
    Object.assign(range, { type: 'range', id, min: 0, max: 1, step: 0.01, value: influences[m.index] });
    range.addEventListener('input', () => {
      influences[m.index] = +range.value;
      requestDraw();
    });
    morphList.append(label, range);
  }
}
function closeMorphPanel() {
  morphPanel.hidden = true;
  morphObj = null;
}
morphTabs.forEach(t => t.addEventListener('click', () => showMorphTab(+t.dataset.panel)));
document.getElementById('morph-close').addEventListener('click', closeMorphPanel);
document.getElementById('morph-zero').addEventListener('click', () => {
  if (!morphObj) return;
  morphObj.model.morphTargetInfluences?.fill(0);
  morphList.querySelectorAll('input').forEach(r => { r.value = 0; });
  requestDraw();
});

// --- MMD のステージ ---
// 横幅か奥行きが 40 (MMD の単位) を超えるか、名前に「ステージ」などを含む .pmx はステージとして扱う。
// ステージは原点に 1 つだけ置き、掴んだり積んだりはできない (触るとカメラの操作になる)
const STAGE = Symbol('stage');
let stageModel = null;
function isStageModel(mesh, fileName) {
  const size = new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3());
  return Math.max(size.x, size.z) > 40 || /ステージ|stage|舞台/i.test(`${mesh.name} ${fileName}`);
}
function addStage(mesh) {
  removeStage();
  mesh.scale.setScalar(MMD_SCALE);
  mesh.traverse(o => {
    if (!o.isMesh) return;
    o.raycast = () => {};    // 掴めない
    o.castShadow = false;     // 屋根や壁で全体が影にならないよう、影は受けるだけ
    o.receiveShadow = true;
  });
  scene.add(mesh);
  stageModel = mesh;
  // ステージの床とちらつかないよう、地面のグリッドと影の板は隠す (影はステージの床が受ける)
  grid.visible = shadowPlane.visible = false;
  requestDraw();
}
function removeStage() {
  if (!stageModel) return;
  scene.remove(stageModel);
  disposeModel(stageModel);
  stageModel = null;
  grid.visible = shadowPlane.visible = true;
  requestDraw();
}
function applyCameraMotion() {
  const c = camMotion.cam, m = stageMatrix();
  camera.position.copy(c.position).applyMatrix4(m);
  _target.copy(animHelper.cameraTarget.position).applyMatrix4(m);
  camera.up.copy(_up.copy(c.up).transformDirection(m));
  camera.lookAt(_target);
  if (camera.fov !== c.fov) { camera.fov = c.fov; camera.updateProjectionMatrix(); }
  camera.updateMatrixWorld();
}
// カメラモーションをやめる。keepView なら、いまの視点から手動の操作に引き継ぐ
function stopCameraMotion(keepView) {
  if (!camMotion) return;
  if (keepView) {
    // カメラモーションの注視点・位置・視野角をそのまま引き継ぐ (傾き (ロール) だけは引き継げない)
    applyCameraMotion();
    const off = camera.position.clone().sub(_target);
    const len = Math.max(off.length(), 0.01);
    Object.assign(cam, {
      tx: _target.x, ty: Math.max(_target.y, 0), tz: _target.z,
      dist: Math.min(len, 60),
      yaw: Math.atan2(off.z, off.x),
      pitch: Math.min(Math.max(Math.asin(off.y / len), -1.4), 1.5),
      fov: camera.fov,
    });
  }
  animHelper.remove(camMotion.cam);
  camMotion = null;
  requestDraw();
}
function stopMotion(obj) {
  if (!obj.animated) return;
  animHelper.remove(obj.model);
  obj.animated = false;
}
const hasMotion = () => !!camMotion || boxes.some(b => b.animated);

// --- 曲 ---
// 曲のファイルを一緒に選ぶと、モーションと一緒に繰り返し再生する。モーションは曲の再生位置に合わせて進める
let music = null;          // <audio>
let musicWaiting = false;  // ブラウザに自動再生を止められ、画面を触るのを待っている
let motionClock = 0;       // モーションを進めた時間 (曲の再生位置とのずれを見る)
const musicButton = document.getElementById('music');
function startMusic(file, announce = true) {
  stopMusic();
  music = new Audio(URL.createObjectURL(file));
  music.loop = true;
  music.addEventListener('play', () => { updateMusicButton(); startTicking(); });
  music.addEventListener('pause', updateMusicButton);
  musicButton.hidden = false;
  if (animHelper && hasMotion()) restartMotions(); // ダンスも最初から
  motionClock = 0;
  playMusic(announce ? file.name : null, announce);
}
function playMusic(name, announce = true) {
  musicWaiting = false;
  music.play().then(() => {
    if (name) toast(`${name} を再生しています`);
    else if (announce) toastEl.hidden = true; // 「画面をタップ…」のお知らせを消す
  }, () => {
    musicWaiting = true;
    toast('画面をタップ (クリック) すると曲を再生します', 0);
  });
}
function stopMusic() {
  if (!music) return;
  music.pause();
  URL.revokeObjectURL(music.src);
  music = null;
  musicWaiting = false;
  musicButton.hidden = true;
}
function updateMusicButton() {
  const paused = !music || music.paused;
  musicButton.textContent = paused ? '▶' : '⏸';
  musicButton.setAttribute('aria-label', paused ? '曲とモーションを再生' : '曲とモーションを一時停止');
}
musicButton.addEventListener('click', () => {
  if (!music) return;
  if (music.paused) playMusic(); else music.pause();
});
// このフレームでモーションを進める時間。曲がなければ経過時間そのまま
function motionDelta(dt) {
  if (!music) return dt;
  if (music.paused) return 0; // 一時停止中 (自動再生待ちも含む) はモーションも止める
  const t = music.currentTime;
  if (t < motionClock - 1) { // 曲が最初に戻った
    restartMotions();
    motionClock = t;
    return t;
  }
  // 曲の再生位置に合わせる。少しのずれはなめらかに寄せ、大きくずれたら一気に合わせる
  const drift = t - motionClock;
  const d = Math.abs(drift) > 0.5 ? Math.max(drift, 0) : Math.max(dt + drift * 0.1, 0);
  motionClock += d;
  return d;
}

function stopPhysics(obj) {
  const i = physicsList.findIndex(p => p.obj === obj);
  if (i >= 0) physicsList.splice(i, 1); // Ammo 側の後片付けの API はないので、参照を外すだけ
}
// 物理演算のあるモデルがあるあいだは、毎フレーム計算して描き直す
let ticking = false, tickLast = 0;
function startTicking() {
  if (ticking) return;
  ticking = true;
  tickLast = 0;
  requestAnimationFrame(tick);
}
const _p = new THREE.Vector3(), _v = new THREE.Vector3(), _a = new THREE.Vector3();
// 縦軸まわりに回したときの揺れ。回転は剛体ごとに軸からの位置で力が変わるので、見かけの重力ではなく
// 剛体 1 つずつに見かけの力をかける (Ammo は 1 回の計算のあとに力を消すので、毎フレームかけ直す)
//   オイラー力 (回し始め・止めるときに取り残される) -α×r、遠心力 ω²r、コリオリ力 -2ω×v
function applyRotationForces(p, dt) {
  const r = p.obj.r;
  if (p.prevR !== null && dt > 0) {
    const w = (r - p.prevR) / dt;
    p.alpha += ((w - p.w) / dt - p.alpha) * 0.25; // 急な変化はならす
    p.w = w;
  }
  p.prevR = r;
  const w = p.w, alpha = p.alpha;
  if (Math.abs(w) < 1e-3 && Math.abs(alpha) < 1e-2) return;
  const limit = MMD_GRAVITY * 2;
  for (const rb of p.dynamic) {
    const body = rb.body;
    const o = body.getCenterOfMassTransform().getOrigin();
    const x = o.x() - p.axisX, z = o.z() - p.axisZ;
    const v = body.getLinearVelocity();
    let ax = (w * w * x - alpha * z - 2 * w * v.z()) * ROT_INERTIA;
    let az = (w * w * z + alpha * x + 2 * w * v.x()) * ROT_INERTIA;
    const len = Math.hypot(ax, az);
    if (len > limit) { ax *= limit / len; az *= limit / len; }
    const m = rb.params.weight;
    p.force.setValue(ax * m, 0, az * m);
    body.activate(); // 止まって眠っている剛体も起こす
    body.applyCentralForce(p.force);
  }
}
function tick(now) {

  const dt = tickLast ? Math.min(Math.max(now - tickLast, 0) / 1000, 1 / 20) : 1 / 60;
  tickLast = now;
  if (hasMotion()) animHelper.update(motionDelta(dt)); // モーションを先に進めてから物理演算
  for (const p of physicsList) {
    // モデルの動きの加速度を「見かけの重力」として足す (運ぶと髪がなびき、落ちると浮く)。
    // MMDPhysics はモデル自身の座標で計算するので、置き場所の動きはこうしないと伝わらない
    const o = p.obj;
    _p.set(o.x, o.py, o.z);
    if (p.prev && dt > 0) {
      _v.subVectors(_p, p.prev).divideScalar(dt);
      _a.subVectors(_v, p.vel).divideScalar(dt);
      p.vel.copy(_v);
      p.acc.lerp(_a, 0.25); // 急な変化はならす
    }
    p.prev = (p.prev ?? new THREE.Vector3()).copy(_p);
    // ワールドの加速度を、モデルの向き・単位に直す
    const a = _a.copy(p.acc).applyAxisAngle(THREE.Object3D.DEFAULT_UP, -o.r).multiplyScalar(p.scale * INERTIA);
    a.clampLength(0, MMD_GRAVITY * 2);
    p.gravity.setValue(-a.x, -MMD_GRAVITY - a.y, -a.z);
    p.physics.world.setGravity(p.gravity);
    applyRotationForces(p, dt);
    p.physics.update(dt);
  }

}

// --- 描画 ---
let pending = false;
function requestDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}
// 掴んでいる物 (とパレットで色を変えている形) を明るくする
function setHighlight(obj, on) {
  obj.node.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [o.material].flat()) {
      if (!m.emissive) continue;
      m.userData.baseEmissive ??= m.emissive.clone();
      m.emissive.copy(m.userData.baseEmissive);
      if (on) m.emissive.addScalar(obj.s === 3 ? 0.12 : 0.3); // トゥーン調のモデルは明るくなりやすいので控えめに
    }
  });
}
function render() {
  updateCamera();
  const held = drag?.box?.box ?? drag?.rot?.box ?? drag?.twist?.box ?? pickerBox;
  for (const b of boxes) {
    b.node.position.set(b.x, b.py, b.z);
    b.node.rotation.y = b.r;
    if (b.mesh) b.mesh.material.color.setRGB(...PALETTE[b.c], THREE.LinearSRGBColorSpace);
    setHighlight(b, b === held);
  }
  // 影は注視点のまわりだけ計算する
  const span = Math.max(12, cam.dist * 1.2);
  sun.target.position.set(cam.tx, 0, cam.tz);
  sun.position.copy(sun.target.position).addScaledVector(LIGHT, 40);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 100 });
  sun.shadow.camera.updateProjectionMatrix();
  if (fx && anyFx()) {
    // 効果 (MME 風) を使うときは、後処理を通して描く
    for (const k of Object.keys(fxState)) fx.passes[k].enabled = fxState[k];
    if (fxState.dof) fx.passes.dof.uniforms.focus.value = camera.position.distanceTo(focusPoint());
    fx.composer.render();
  } else {
    outline.render(scene, camera);
  }
}

function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  if (fx) {
    fx.composer.setPixelRatio(renderer.getPixelRatio());
    fx.composer.setSize(innerWidth, innerHeight);
  }
  render();
}

// --- 効果 (MME 風の後処理) ---
// MME の .fx (DirectX 用の HLSL) はブラウザでは動かせないので、よく使われる MME に近い効果を組み込みで用意する
//   光る       … AutoLuminous 風。明るい部分だけをにじませるブルーム
//   ふんわり   … Diffusion 風。画面全体に弱いブルームをかけて、やわらかい光のにじみを出す
//   被写界深度 … 注視点にピントを合わせ、それ以外をぼかす
//   影の濃さ   … SSAO 風 (GTAO)。物の接する所や隙間を暗くする
const FX_KEY = 'webgl-grid-fx';
const fxState = { ao: false, dof: false, bloom: false, diffusion: false }; // 後処理をかける順
try { Object.assign(fxState, JSON.parse(localStorage.getItem(FX_KEY) ?? '{}')); } catch {}
const anyFx = () => Object.values(fxState).some(Boolean);
// 効果の強さ。光る・ふんわりはブルームの強さそのもの、被写界深度は標準のぼけに対する倍率、
// 影の濃さは 1 までが暗さの混ぜ具合、1 を超えると暗くなる範囲を広げる
const FX_LEVEL_KEY = 'webgl-grid-fx-level';
const FX_LEVEL_DEFAULT = { ao: 1, dof: 1, bloom: 0.7, diffusion: 0.2 };
const fxLevel = { ...FX_LEVEL_DEFAULT };
try { Object.assign(fxLevel, JSON.parse(localStorage.getItem(FX_LEVEL_KEY) ?? '{}')); } catch {}
let fx = null, fxLoading = null;
function applyFxLevels() {
  if (!fx) return;
  const { ao, dof, bloom, diffusion } = fx.passes;
  bloom.strength = fxLevel.bloom;
  diffusion.strength = fxLevel.diffusion;
  dof.uniforms.aperture.value = 0.0025 * fxLevel.dof;
  dof.uniforms.maxblur.value = 0.02 * fxLevel.dof;
  ao.blendIntensity = Math.min(fxLevel.ao, 1);
  ao.updateGtaoMaterial({ radius: 0.6 * Math.max(fxLevel.ao, 1), scale: Math.max(fxLevel.ao, 1) });
}
// 被写界深度のピントを合わせる点 (カメラモーション中はその注視点)
const focusPoint = () => camMotion ? _target : new THREE.Vector3(cam.tx, cam.ty, cam.tz);
function ensureFx() {
  fxLoading ??= (async () => {
    const pp = 'three/addons/postprocessing/';
    const [{ EffectComposer }, { Pass }, { UnrealBloomPass }, { BokehPass }, { GTAOPass }, { OutputPass }] = await Promise.all(
      ['EffectComposer', 'Pass', 'UnrealBloomPass', 'BokehPass', 'GTAOPass', 'OutputPass'].map(n => import(`${pp}${n}.js`)));
    // 後処理では CSS の背景が透けないので、同じ縦のグラデーションを最初に全面に描く。
    // (scene.background にすると、影の濃さ (GTAO) の法線を描くときに背景の板まで法線用の材質で描かれ、
    //  値が壊れて黒く抜けるので、シーンには入れない)
    const top = new THREE.Color('#5a6172'), bottom = new THREE.Color('#3b414c'); // リニアに変換される
    const bgScene = new THREE.Scene(), bgCamera = new THREE.Camera();
    bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: { top: { value: top }, bottom: { value: bottom } },
      vertexShader: 'varying float vY; void main() { vY = uv.y; gl_Position = vec4(position.xy, 0.0, 1.0); }',
      fragmentShader: `uniform vec3 top, bottom; varying float vY;
        void main() { gl_FragColor = vec4(mix(bottom, top, vY), 1.0);
        #include <colorspace_fragment>
        }`,
    })));
    // 背景と、MMD の輪郭線 (OutlineEffect) ごとシーンを描く最初のパス
    class OutlineRenderPass extends Pass {
      constructor() { super(); this.needsSwap = false; }
      render(r, writeBuffer, readBuffer) {
        r.setRenderTarget(this.renderToScreen ? null : readBuffer);
        r.clear();
        r.render(bgScene, bgCamera);
        outline.autoClear = false; // 背景を消さずに上に描く
        outline.render(scene, camera);
        outline.autoClear = true;
      }
    }
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(innerWidth, innerHeight);
    const size = new THREE.Vector2(innerWidth, innerHeight);
    const passes = {
      ao: new GTAOPass(scene, camera, innerWidth, innerHeight),
      // ピントからの距離 × aperture だけぼかす (上限 maxblur は画面幅に対する割合)
      dof: new BokehPass(scene, camera, { focus: 10, aperture: 0.0025, maxblur: 0.02 }),
      // 引数は (大きさ, 強さ, 広がり, しきい値)。光るはごく明るい所だけ、ふんわりは全体に弱く
      bloom: new UnrealBloomPass(size, 0.7, 0.4, 0.95),
      diffusion: new UnrealBloomPass(size, 0.2, 0.7, 0),
    };
    composer.addPass(new OutlineRenderPass());
    for (const k of Object.keys(fxState)) composer.addPass(passes[k]);
    composer.addPass(new OutputPass());
    fx = { composer, passes };
    applyFxLevels();
  })();
  return fxLoading;
}
const fxPanel = document.getElementById('fx-panel');
const fxToggle = document.getElementById('fx-toggle');
const fxButtons = fxPanel.querySelectorAll('button[data-fx]');
const fxSliders = fxPanel.querySelectorAll('input[data-fx-level]');
function updateFxButtons() {
  fxButtons.forEach(b => b.setAttribute('aria-pressed', fxState[b.dataset.fx]));
  fxSliders.forEach(r => r.classList.toggle('off', !fxState[r.dataset.fxLevel]));
}
fxSliders.forEach(r => { r.value = fxLevel[r.dataset.fxLevel]; });
function closeFxPanel() {
  fxPanel.hidden = true;
  fxToggle.setAttribute('aria-expanded', 'false');
}
fxToggle.addEventListener('click', () => {
  closeMorphPanel();
  fxPanel.hidden = !fxPanel.hidden;
  fxToggle.setAttribute('aria-expanded', String(!fxPanel.hidden));
});
// 強さのスライダー。オフの効果を動かしたら、その効果をオンにする
fxSliders.forEach(r => r.addEventListener('input', () => {
  const k = r.dataset.fxLevel;
  fxLevel[k] = +r.value;
  try { localStorage.setItem(FX_LEVEL_KEY, JSON.stringify(fxLevel)); } catch {}
  applyFxLevels();
  if (!fxState[k]) setFx(k, true);
  else requestDraw();
}));
fxButtons.forEach(b => b.addEventListener('click', () => setFx(b.dataset.fx, !fxState[b.dataset.fx])));
async function setFx(k, on) {
  fxState[k] = on;
  updateFxButtons();
  try { localStorage.setItem(FX_KEY, JSON.stringify(fxState)); } catch {}
  if (anyFx() && !fx) {
    toast('効果を準備中…', 0);
    try {
      await ensureFx();
      toastEl.hidden = true;
    } catch (err) {
      console.error(err);
      toast(`効果を読み込めませんでした: ${err?.message ?? err}`, 8000);
    }
  }
  requestDraw();
}
updateFxButtons();
if (anyFx()) ensureFx().then(requestDraw, err => console.error(err)); // 前回オンにしていた効果
addEventListener('resize', resize);
resize();

// 動作確認用: ?debug を付けて開いたときだけ、中の状態をコンソールから触れるようにする
if (new URLSearchParams(location.search).has('debug')) {
  Object.assign(window, { THREE, renderer, scene, camera, boxes, cam, makeBox, settle, pickBox, screenRay, rayPlane,
    loadPmx, loadFiles, getAnimHelper: () => animHelper, getCamMotion: () => camMotion, getStage: () => stageModel, getFx: () => fx, getMorphObj: () => morphObj, fxState, fxLevel, getMusic: () => music, camera, getDrag: () => drag, paletteEl, swatches, pointers, physicsList, outline });
}
</script>
