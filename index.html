<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Shader</title>
<style>
  /* 背景は、以前シェーダーで描いていた縦のグラデーションと同じ色 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(to top, #3b414c, #5a6172); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none;
           -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  canvas.dragging { cursor: grabbing; }
  canvas.pan { cursor: move; }
  canvas.over-box { cursor: pointer; }
  .modes, .shapes {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 2px; padding: 3px;
    background: rgba(20, 24, 32, 0.85); border: 1px solid #2c3340; border-radius: 10px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .modes button, .shapes button {
    font: 13px/1 system-ui, sans-serif; color: #9aa4b5;
    background: transparent; border: 0; border-radius: 7px;
    padding: 9px 14px; cursor: pointer;
  }
  .modes button:hover, .shapes button:hover { color: #dce3ee; }
  .shapes { bottom: 66px; }
  .modes button[aria-pressed="true"], .shapes button[aria-pressed="true"] { background: #3a4558; color: #fff; }
  .modes .sep, .shapes .sep { width: 1px; margin: 4px 3px; background: #2c3340; }
  .modes button:disabled, .shapes button:disabled { opacity: 0.4; cursor: default; }
  .palette {
    position: fixed; display: grid; grid-template-columns: repeat(4, 40px); gap: 8px; padding: 10px;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 12px;
    backdrop-filter: blur(6px); user-select: none;
  }
  .palette[hidden] { display: none; }
  .palette button {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.15);
  }
  .palette button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35); }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    max-width: calc(100vw - 32px); box-sizing: border-box; padding: 10px 14px;
    font: 13px/1.5 system-ui, sans-serif; color: #dce3ee; overflow-wrap: anywhere;
    background: rgba(20, 24, 32, 0.92); border: 1px solid #2c3340; border-radius: 10px;
  }
  .toast[hidden] { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<div class="palette" id="palette" role="group" aria-label="色" hidden></div>
<div class="shapes" role="group" aria-label="追加する形">
  <button type="button" data-shape="0" aria-pressed="true">立方体</button>
  <button type="button" data-shape="1" aria-pressed="false">トーラス</button>
  <button type="button" data-shape="2" aria-pressed="false">三角錐</button>
  <span class="sep"></span>
  <button type="button" id="load-pmx" aria-label="MMD のモデル (.pmx) やモーション (.vmd) を読み込む">MMD…</button>
</div>
<input type="file" id="pmx-input" multiple hidden
       accept=".pmx,.vmd,.png,.jpg,.jpeg,.bmp,.tga,.gif,.spa,.sph,image/*">
<div class="modes" role="group" aria-label="操作モード">
  <button type="button" data-mode="orbit" aria-pressed="true">回転</button>
  <button type="button" data-mode="pan" aria-pressed="false">移動</button>
  <span class="sep"></span>
  <button type="button" id="add">追加</button>
  <button type="button" id="reset">リセット</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch {
  document.body.textContent = 'WebGL2 に対応していません';
  throw new Error('WebGL2 unavailable');
}
renderer.setClearColor(0x000000, 0); // 背景は CSS のグラデーションを見せる
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// MMD モデルの輪郭線。太さ・色・表示の有無は、MMDLoader が .pmx の材質から読んで
// material.userData.outlineParameters に入れてくれる。それ以外の物は noOutline() で輪郭線を付けない
// (userData は材質ごとに書き込むので、毎回新しいオブジェクトを渡す)
const outline = new OutlineEffect(renderer);
const noOutline = () => ({ outlineParameters: { visible: false } });

const scene = new THREE.Scene();
// 以前のシェーダーと同じ画角 (画面の高さに対して焦点距離 1.6)
const camera = new THREE.PerspectiveCamera(2 * Math.atan(0.5 / 1.6) * 180 / Math.PI, 1, 0.05, 1000);

// --- 光 ---
const LIGHT = new THREE.Vector3(0.6, 1.0, 0.35).normalize();
scene.add(new THREE.AmbientLight(0xffffff, 0.18 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 0.82 * Math.PI);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// --- 地面のグリッド (以前のシェーダーと同じ線・軸・フェード) ---
const grid = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    userData: noOutline(),
    vertexShader: `
      varying vec3 vWorld;
      void main() {
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vWorld;
      // 線幅(ピクセル単位)を一定に保つアンチエイリアス付きグリッド
      float grid(vec2 p, float lineWidth) {
        vec2 d = fwidth(p);
        vec2 g = abs(fract(p - 0.5) - 0.5) / d;
        float line = min(g.x, g.y);
        return 1.0 - clamp(line - lineWidth + 1.0, 0.0, 1.0);
      }
      void main() {
        vec2 p = vWorld.xz;
        vec3 c = vec3(0.07, 0.08, 0.10);
        c = mix(c, vec3(0.30, 0.34, 0.42), grid(p, 1.0));
        c = mix(c, vec3(0.55, 0.62, 0.75), grid(p / 5.0, 1.5));
        // 原点の軸 (X: 赤, Z: 青)
        vec2 ad = abs(p) / fwidth(p);
        c = mix(c, vec3(0.90, 0.30, 0.30), 1.0 - clamp(ad.y - 1.0, 0.0, 1.0));
        c = mix(c, vec3(0.30, 0.50, 0.95), 1.0 - clamp(ad.x - 1.0, 0.0, 1.0));
        // 遠くほど透明にして背景に溶かす
        float fade = exp(-distance(cameraPosition, vWorld) * 0.035);
        gl_FragColor = vec4(pow(c, vec3(1.0 / 2.2)), fade);
      }`,
  }),
);
// 地面に落ちる影 (グリッドの上に重ねる)
const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.55, depthWrite: false, userData: noOutline() }),
);
shadowPlane.receiveShadow = true;
shadowPlane.position.y = 0.0005;
shadowPlane.renderOrder = 1;
scene.add(grid, shadowPlane);

// --- 色 ---
// 色はリニア値
const PALETTE = [
  [0.85, 0.62, 0.32], // 黄土
  [0.85, 0.22, 0.18], // 赤
  [0.12, 0.58, 0.52], // 青緑
  [0.18, 0.32, 0.85], // 青
  [0.55, 0.28, 0.80], // 紫
  [0.35, 0.70, 0.22], // 緑
  [0.90, 0.32, 0.55], // ピンク
  [0.62, 0.66, 0.72], // 灰
];
const PALETTE_NAMES = ['黄土', '赤', '青緑', '青', '紫', '緑', 'ピンク', '灰'];

// --- お知らせ (読み込み中・エラーなど) ---
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(text, ms = 4000) {
  toastEl.textContent = text;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
}

// --- 色選び (スマホで形をタップしたときに出すパレット) ---
const paletteEl = document.getElementById('palette');
let pickerBox = null; // パレットで色を変えている形
const swatches = PALETTE.map((c, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', PALETTE_NAMES[i]);
  b.style.background = `rgb(${c.map(v => Math.round(Math.pow(v, 1 / 2.2) * 255)).join(',')})`;
  b.addEventListener('click', () => {
    if (pickerBox) pickerBox.c = i;
    closePicker();
  });
  paletteEl.append(b);
  return b;
});
function openPicker(box, x, y) {
  pickerBox = box;
  swatches.forEach((b, i) => b.setAttribute('aria-pressed', i === box.c));
  paletteEl.hidden = false;
  // タップした位置の上に出す。画面からはみ出す場合は下に出し、左右は端から 16px 以上離す
  const w = paletteEl.offsetWidth, h = paletteEl.offsetHeight;
  paletteEl.style.left = `${Math.min(Math.max(x - w / 2, 16), innerWidth - w - 16)}px`;
  paletteEl.style.top = `${y - h - 24 >= 16 ? y - h - 24 : Math.min(y + 24, innerHeight - h - 16)}px`;
  requestDraw();
}
function closePicker() {
  if (paletteEl.hidden) return;
  paletteEl.hidden = true;
  pickerBox = null;
  requestDraw();
}
addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
// まだ使われていない色を優先し、全色使用中なら一番使われていない色を選ぶ
function nextColor() {
  const used = PALETTE.map((_, i) => boxes.filter(b => b.c === i).length);
  return used.indexOf(Math.min(...used));
}
const MAX_BOXES = 32;

// オービットカメラ (注視点を中心に回転 / 地面に沿って移動)
const CAM_DEFAULT = { yaw: Math.PI / 4, pitch: 0.6, dist: 9.8, tx: 0, tz: 0 };
const cam = { ...CAM_DEFAULT };
document.getElementById('reset').addEventListener('click', () => {
  closePicker();
  Object.assign(cam, CAM_DEFAULT);
  while (boxes.length) removeObject(boxes[0]);
  boxes.push(makeBox(0, 0, 0));
  updateAddButton();
  requestDraw();
});

let mode = 'orbit';
const modeButtons = document.querySelectorAll('.modes button[data-mode]');
function setMode(m) {
  mode = m;
  modeButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  canvas.classList.toggle('pan', m === 'pan');
}
modeButtons.forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// --- 置いた物 (形と PMX モデル) ---
// x, z は底面中心、y は積み重ねで決まる高さ、py は画面に表示している高さ (落下中は y より上)、vy は落下速度
// r は縦軸まわりの回転角 (ラジアン)、c は色 (モデルは -1)
// s は種類 (0: 立方体, 1: トーラス, 2: 三角錐, 3: PMX モデル)
// h は高さ、hx / hz は上から見た足場の半分の幅 (回転前)
// node は three.js の表示用オブジェクト
const SHAPE_GEOMETRY = [
  new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0),
  // 寝かせたトーラス: 中心円の半径 0.35、管の半径 0.15 (高さ 0.3)
  new THREE.TorusGeometry(0.35, 0.15, 24, 64).rotateX(Math.PI / 2).translate(0, 0.15, 0),
  // 三角錐: 底面は外接円の半径 0.5 の正三角形、高さ 0.8
  new THREE.ConeGeometry(0.5, 0.8, 3, 1).translate(0, 0.4, 0),
];
const SHAPE_HEIGHT = [1, 0.3, 0.8];
function makeNode(obj, object3d) {
  const node = new THREE.Group();
  node.add(object3d);
  node.userData.obj = obj;
  object3d.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(node);
  obj.node = node;
  return obj;
}
function makeBox(x, z, c, s = 0) {
  const obj = { x, y: 0, z, c, s, r: 0, py: 0, vy: 0, h: SHAPE_HEIGHT[s], hx: 0.5, hz: 0.5 };
  const mesh = new THREE.Mesh(SHAPE_GEOMETRY[s], new THREE.MeshLambertMaterial({ flatShading: s === 2, userData: noOutline() }));
  obj.mesh = mesh;
  return makeNode(obj, mesh);
}
function removeObject(obj) {
  scene.remove(obj.node);
  stopPhysics(obj);
  stopMotion(obj);
  if (obj.s === 3) {
    // モデルは形状・材質・テクスチャを片付ける
    obj.node.traverse(o => {
      if (!o.isMesh) return;
      o.geometry.dispose();
      for (const m of [o.material].flat()) {
        // MMD の材質はテクスチャを uniforms の中に持っている
        for (const v of [...Object.values(m), ...Object.values(m.uniforms ?? {}).map(u => u.value)]) {
          if (v?.isTexture) v.dispose();
        }
        m.dispose();
      }
    });
  } else {
    obj.mesh.material.dispose();
  }
  boxes.splice(boxes.indexOf(obj), 1);
}
const topOf = b => b.y + b.h; // 上に載せられる高さ

// 追加する形の選択
let currentShape = 0;
const shapeButtons = document.querySelectorAll('.shapes button[data-shape]');
shapeButtons.forEach(b => b.addEventListener('click', () => {
  currentShape = +b.dataset.shape;
  shapeButtons.forEach(o => o.setAttribute('aria-pressed', o === b));
}));
const boxes = [makeBox(0, 0, 0)];

// --- 積み重ね ---
// 上から見て足場が重なっているか (回転した長方形どうしを分離軸判定で調べる)
function overlaps(a, b) {
  const e = 0.0005; // 辺がちょうど接しているだけなら重なりとしない
  const axes = r => [[Math.cos(r), -Math.sin(r)], [Math.sin(r), Math.cos(r)]];
  const aa = axes(a.r), ba = axes(b.r);
  const d = [b.x - a.x, b.z - a.z];
  const dot = (u, v) => u[0] * v[0] + u[1] * v[1];
  for (const u of [...aa, ...ba]) {
    const ra = (a.hx - e) * Math.abs(dot(u, aa[0])) + (a.hz - e) * Math.abs(dot(u, aa[1]));
    const rb = (b.hx - e) * Math.abs(dot(u, ba[0])) + (b.hz - e) * Math.abs(dot(u, ba[1]));
    if (Math.abs(dot(d, u)) >= ra + rb) return false;
  }
  return true;
}
// b の上に (直接または間接的に) 載っている物と b 自身
function stackFrom(b) {
  const group = [b];
  for (let i = 0; i < group.length; i++) {
    const s = group[i];
    for (const o of boxes) {
      if (!group.includes(o) && overlaps(o, s) && Math.abs(o.y - topOf(s)) < 1e-3) group.push(o);
    }
  }
  return group;
}
// 重力: 下にあるものから順に、足場の一番高い所まで落とす (exclude は動かさない)
function settle(exclude = []) {
  const placed = [];
  for (const b of boxes.filter(b => !exclude.includes(b)).sort((a, b) => a.y - b.y)) {
    b.y = Math.max(0, ...placed.filter(o => overlaps(o, b)).map(topOf));
    placed.push(b);
  }
  startFall();
}

// 落下アニメーション: 表示上の高さ py を、重力で y まで落とす (着地で少し跳ねる)。
// 上がるときは y より少し高くまで跳び上がってから、同じ重力で着地する
const GRAVITY = 40;
const HOP = 0.25; // 跳び乗るときに y より上へ跳ぶ高さ
let falling = false, lastTime = 0;
function startFall() {
  for (const b of boxes) {
    if (b.py >= b.y) continue;
    const v0 = Math.sqrt(2 * GRAVITY * (b.y - b.py + HOP));
    if (b.vy > -v0) b.vy = -v0; // vy は下向きが正
  }
  if (falling || !boxes.some(b => b.py !== b.y || b.vy !== 0)) return;
  falling = true;
  lastTime = 0;
  requestAnimationFrame(fallStep);
}
function fallStep(now) {
  // 最初のフレームは基準時刻だけ取る (rAF の時刻は performance.now() より前のことがある)
  const dt = lastTime ? Math.min(Math.max(now - lastTime, 0) / 1000, 1 / 30) : 0;
  lastTime = now;
  let moving = false;
  for (const b of boxes) {
    if (b.py === b.y && b.vy === 0) continue;
    b.vy += GRAVITY * dt;
    b.py -= b.vy * dt;
    if (b.vy > 0 && b.py <= b.y) {
      b.py = b.y;
      b.vy = b.vy > 3 ? -b.vy * 0.25 : 0; // 速ければ小さく跳ね返る
    }
    if (b.py !== b.y || b.vy !== 0) moving = true;
  }
  render();
  if (moving) requestAnimationFrame(fallStep);
  else falling = false;
}

// 画面中央 (注視点) に近い、ほかの物と重ならないマス目を探す (半径 rad の物を置く)
const radiusOf = b => Math.hypot(b.hx, b.hz);
function findFreeSpot(rad) {
  const cx = Math.round(cam.tx), cz = Math.round(cam.tz);
  const free = (x, z) => boxes.every(b => Math.max(Math.abs(b.x - x), Math.abs(b.z - z)) >= radiusOf(b) + rad + 0.1);
  for (let r = 0; r < 40; r++) {
    for (let i = -r; i <= r; i++) {
      for (const [x, z] of [[cx + i, cz - r], [cx + i, cz + r], [cx - r, cz + i], [cx + r, cz + i]]) {
        if (free(x, z)) return [x, z];
      }
    }
  }
  return [cx, cz];
}
const addButton = document.getElementById('add');
const loadButton = document.getElementById('load-pmx');
function updateAddButton() {
  addButton.disabled = loadButton.disabled = boxes.length >= MAX_BOXES;
}
addButton.addEventListener('click', () => {
  if (boxes.length >= MAX_BOXES) return;
  const [x, z] = findFreeSpot(Math.SQRT1_2);
  boxes.push(makeBox(x, z, nextColor(), currentShape));
  updateAddButton();
  requestDraw();
});

// --- カメラと、画面上の点からのレイ ---
function camPos() {
  const cp = Math.cos(cam.pitch);
  return [
    cam.tx + cam.dist * cp * Math.cos(cam.yaw),
    cam.dist * Math.sin(cam.pitch),
    cam.tz + cam.dist * cp * Math.sin(cam.yaw)];
}
function updateCamera() {
  camera.position.set(...camPos());
  camera.lookAt(cam.tx, 0, cam.tz);
  camera.updateMatrixWorld();
}
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function screenRay(cx, cy) {
  updateCamera();
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return { ro: raycaster.ray.origin.toArray(), rd: raycaster.ray.direction.toArray() };
}
// 一番手前で当たる物 { box, t } (なければ null)。three.js のレイキャストで、見た目の形どおりに判定する
function pickBox({ ro, rd }) {
  raycaster.ray.origin.fromArray(ro);
  raycaster.ray.direction.fromArray(rd);
  const hit = raycaster.intersectObjects(boxes.map(b => b.node), true)[0];
  if (!hit) return null;
  let o = hit.object;
  while (o && !o.userData.obj) o = o.parent;
  return o ? { box: o.userData.obj, t: hit.distance } : null;
}
// レイと水平面 y = h の交点 (xz)。面と平行なら null
function rayPlane({ ro, rd }, h) {
  if (Math.abs(rd[1]) < 1e-6) return null;
  const t = (h - ro[1]) / rd[1];
  return t > 0 ? [ro[0] + rd[0] * t, ro[2] + rd[2] * t] : null;
}

let drag = null;
const LONG_PRESS_MS = 400; // スマホで形を掴む・置くまでの長押し時間
// 長押しが成立したことを振動で知らせる (ブラウザは、まだ一度も操作されていないページからの振動を拒否する)
const buzz = () => { if (navigator.userActivation?.hasBeenActive ?? true) navigator.vibrate?.(15); };
// 置いた物を、少し上から落として着地させる
function dropIn(b) {
  settle();
  b.py = b.y + 1.5;
  b.vy = 0;
  startFall();
  updateAddButton();
}
// 指定した地面の位置に形を置く。ほかの物と重なればその上に積む
function placeBox(x, z) {
  if (boxes.length >= MAX_BOXES) return false;
  const b = makeBox(x, z, nextColor(), currentShape);
  boxes.push(b);
  dropIn(b);
  return true;
}
const pointers = new Map(); // 画面に触れている指 (マウス) の位置

// b とその上に載っている物を、b を軸にまとめて回すための情報
const rotationGroup = b =>
  ({ box: b, group: stackFrom(b).map(o => ({ o, dx: o.x - b.x, dz: o.z - b.z, r: o.r })) });
// 回し始めからの角度 a (ラジアン) だけ回す
function rotateGroup({ box, group }, a) {
  const c = Math.cos(a), sn = Math.sin(a);
  for (const g of group) {
    g.o.x = box.x + g.dx * c + g.dz * sn;
    g.o.z = box.z - g.dx * sn + g.dz * c;
    g.o.r = g.r + a;
  }
  requestDraw();
}
const pointerAngle = ([a, b]) => {
  const p = pointers.get(a), q = pointers.get(b);
  return Math.atan2(q.y - p.y, q.x - p.x);
};
const pointerDistance = ([a, b]) => {

  for (const p of physicsList) {
    // モデルの動きの加速度を「見かけの重力」として足す (運ぶと髪がなびき、落ちると浮く)。
    // MMDPhysics はモデル自身の座標で計算するので、置き場所の動きはこうしないと伝わらない
    const o = p.obj;
    _p.set(o.x, o.py, o.z);
    if (p.prev && dt > 0) {
      _v.subVectors(_p, p.prev).divideScalar(dt);
      _a.subVectors(_v, p.vel).divideScalar(dt);
      p.vel.copy(_v);
      p.acc.lerp(_a, 0.25); // 急な変化はならす
    }
    p.prev = (p.prev ?? new THREE.Vector3()).copy(_p);
    // ワールドの加速度を、モデルの向き・単位に直す
    const a = _a.copy(p.acc).applyAxisAngle(THREE.Object3D.DEFAULT_UP, -o.r).multiplyScalar(p.scale * INERTIA);
    a.clampLength(0, MMD_GRAVITY * 2);
    p.gravity.setValue(-a.x, -MMD_GRAVITY - a.y, -a.z);
    p.physics.world.setGravity(p.gravity);
    p.physics.update(dt);
  }
  render();
  requestAnimationFrame(tick);
}

// --- 描画 ---
let pending = false;
function requestDraw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}
// 掴んでいる物 (とパレットで色を変えている形) を明るくする
function setHighlight(obj, on) {
  obj.node.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [o.material].flat()) {
      if (!m.emissive) continue;
      m.userData.baseEmissive ??= m.emissive.clone();
      m.emissive.copy(m.userData.baseEmissive);
      if (on) m.emissive.addScalar(obj.s === 3 ? 0.12 : 0.3); // トゥーン調のモデルは明るくなりやすいので控えめに
    }
  });
}
function render() {
  updateCamera();
  const held = drag?.box?.box ?? drag?.rot?.box ?? drag?.twist?.box ?? pickerBox;
  for (const b of boxes) {
    b.node.position.set(b.x, b.py, b.z);
    b.node.rotation.y = b.r;
    if (b.mesh) b.mesh.material.color.setRGB(...PALETTE[b.c], THREE.LinearSRGBColorSpace);
    setHighlight(b, b === held);
  }
  // 影は注視点のまわりだけ計算する
  const span = Math.max(12, cam.dist * 1.2);
  sun.target.position.set(cam.tx, 0, cam.tz);
  sun.position.copy(sun.target.position).addScaledVector(LIGHT, 40);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 100 });
  sun.shadow.camera.updateProjectionMatrix();
  outline.render(scene, camera);
}

function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  render();
}
addEventListener('resize', resize);
resize();

// 動作確認用: ?debug を付けて開いたときだけ、中の状態をコンソールから触れるようにする
if (new URLSearchParams(location.search).has('debug')) {
  Object.assign(window, { THREE, renderer, scene, camera, boxes, cam, makeBox, settle, pickBox, screenRay, rayPlane,
    loadPmx, loadFiles, getAnimHelper: () => animHelper, getDrag: () => drag, paletteEl, swatches, pointers, physicsList, outline });
}
</script>
