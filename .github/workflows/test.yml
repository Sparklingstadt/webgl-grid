# push と pull request のたびに、型チェック・lint・単体テスト・e2e テストを流す (npm run test:all)。
# 公開 (GitHub Pages) はしない
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # MCP サーバーは TypeScript をそのまま動かす (22.18 以上)
          cache: npm
      - run: npm ci
      # e2e のブラウザ (Chromium) と、動かすのに要るもの
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      # 失敗したときは、e2e の記録 (スクリーンショット・トレース) を残す
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
